<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1a1a1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="P&amp;P">
<title>Perry &amp; Parkes</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Barlow:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:#f5ede3}
body{font-family:'Barlow',system-ui,sans-serif;color:#1a1a1a;min-height:100vh;-webkit-font-smoothing:antialiased;font-size:15px;line-height:1.45}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;font-size:inherit}
input,select,textarea{font-family:inherit;font-size:16px;color:#1a1a1a}
#login{min-height:100vh;display:none;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;text-align:center}
#login img{width:320px;max-width:86vw;margin-bottom:40px}
.login-q{font-size:12px;letter-spacing:2.5px;text-transform:uppercase;color:#8c8274;margin-bottom:22px;font-weight:700}
.who{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.who button{background:#fffcf7;border:1px solid #e4d8c7;border-radius:22px;padding:26px 28px;min-width:150px;box-shadow:0 12px 32px rgba(26,26,26,.07);transition:transform .15s}
.who button:active{transform:scale(.96)}
.av{width:58px;height:58px;border-radius:50%;background:#1a1a1a;color:#f5ede3;display:flex;align-items:center;justify-content:center;font-family:'Playfair Display',serif;font-weight:700;font-size:20px;margin:0 auto 12px;box-shadow:0 0 0 3px #f5ede3,0 0 0 4px #1a1a1a}
.who .n{font-family:'Playfair Display',serif;font-size:21px;font-weight:700}
.who .r{font-size:11px;color:#8c8274;letter-spacing:1px;text-transform:uppercase;margin-top:4px}
#app{display:none}
.hdr{position:sticky;top:0;z-index:50;background:#1a1a1a;padding-top:env(safe-area-inset-top)}
.hdr-in{max-width:760px;margin:0 auto;height:64px;display:flex;align-items:center;gap:10px;padding:0 14px}
.hdr-logo{height:38px;display:block}
.hdr-sp{flex:1}
.menu-btn{display:flex;align-items:center;gap:8px;background:#2b2b28;color:#f5ede3;border-radius:999px;padding:9px 12px 9px 16px;font-size:15px;font-weight:600}
.menu-btn svg{width:16px;height:16px;transition:transform .2s;color:#f5ede3}
.menu-btn.open svg{transform:rotate(180deg)}
.badge{min-width:19px;height:19px;border-radius:10px;background:#f5ede3;color:#1a1a1a;font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;padding:0 5px}
.me{width:38px;height:38px;border-radius:50%;background:#f5ede3;color:#1a1a1a;font-family:'Playfair Display',serif;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;position:relative;flex-shrink:0}
.me i{position:absolute;right:-1px;bottom:-1px;width:11px;height:11px;border-radius:50%;background:#3ccf7a;border:2px solid #1a1a1a;display:none}
.me i.off{background:#d0543c;display:block}
.scrim{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(26,26,26,.4);opacity:0;pointer-events:none;transition:opacity .2s;z-index:60}
.scrim.on{opacity:1;pointer-events:auto}
.drop{position:fixed;z-index:61;top:calc(env(safe-area-inset-top) + 70px);right:12px;width:300px;max-width:calc(100vw - 24px);background:#1a1a1a;border-radius:20px;padding:8px;box-shadow:0 24px 60px rgba(0,0,0,.4);transform-origin:top right;transform:scale(.95) translateY(-8px);opacity:0;pointer-events:none;transition:transform .18s ease,opacity .18s ease}
.drop.on{transform:none;opacity:1;pointer-events:auto}
.drop button{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border-radius:14px;color:#f5ede3;text-align:left}
.drop button.act{background:#2b2b28}
.drop .ic{width:38px;height:38px;border-radius:11px;background:#2b2b28;display:flex;align-items:center;justify-content:center;color:#f5ede3;flex-shrink:0}
.drop button.act .ic{background:#f5ede3;color:#1a1a1a}
.drop .ic svg{width:19px;height:19px}
.drop .t{font-weight:600;font-size:16px;display:flex;align-items:center;gap:8px}
.drop .s{font-size:12.5px;color:#9a9285}
.drop .sep{height:1px;background:#33332f;margin:6px 10px}
main{max-width:760px;margin:0 auto;padding:22px 16px calc(80px + env(safe-area-inset-bottom))}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:2.2px;text-transform:uppercase;color:#6f665a}
.ptitle{font-family:'Playfair Display',serif;font-size:31px;font-weight:700;line-height:1.15;margin:4px 0}
.psub{color:#8c8274;font-size:14px}
.phead{margin-bottom:18px}
.card{background:#fffcf7;border:1px solid #e9dfd1;border-radius:20px;padding:16px;margin-bottom:14px;box-shadow:0 1px 2px rgba(26,26,26,.04),0 10px 28px rgba(26,26,26,.04)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.card-t{font-family:'Playfair Display',serif;font-size:20px;font-weight:700;line-height:1.2}
.card-k{font-size:12.5px;color:#8c8274;font-weight:600}
.link{font-size:13.5px;font-weight:700;color:#1a1a1a;text-decoration:underline;text-underline-offset:3px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 18px}
.chip{display:inline-flex;align-items:center;gap:6px;background:#1a1a1a;color:#f5ede3;border-radius:999px;padding:8px 13px;font-size:13px;font-weight:600}
.chip.l{background:#ede3d5;color:#1a1a1a}
.chip b{color:#ffffff;font-weight:700}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.tile{background:#fffcf7;border:1px solid #e9dfd1;border-radius:20px;padding:15px;text-align:left;display:flex;flex-direction:column;gap:10px;min-height:124px;box-shadow:0 1px 2px rgba(26,26,26,.04),0 10px 28px rgba(26,26,26,.04);transition:transform .12s}
.tile:active{transform:scale(.97)}
.tile .ic{width:40px;height:40px;border-radius:12px;background:#1a1a1a;color:#f5ede3;display:flex;align-items:center;justify-content:center}
.tile .ic svg{width:20px;height:20px}
.tile .t{font-family:'Playfair Display',serif;font-weight:700;font-size:19px;margin-top:auto}
.tile .s{font-size:12.5px;color:#8c8274;margin-top:-8px}
.tile.dark{background:#1a1a1a;color:#f5ede3;border-color:#1a1a1a}
.tile.dark .ic{background:#f5ede3;color:#1a1a1a}
.tile.dark .s{color:#b5ab9c}
.li{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid #efe6d9}
.li:first-child{border-top:none}
.li .f{flex:1;min-width:0}
.li .a{font-weight:700;font-size:14.5px}
.li .b{font-size:13px;color:#6f665a}
.dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.bar{height:7px;background:#ede3d5;border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:#1a1a1a;border-radius:4px;transition:width .3s}
.bar.g i{background:#1a1a1a}
.empty{color:#a0968a;font-size:14px;padding:6px 0}
.seg{display:flex;background:#ede3d5;border-radius:15px;padding:4px;gap:4px;margin-bottom:16px}
.seg button{flex:1;padding:10px 6px;border-radius:11px;font-size:14px;font-weight:600;color:#6f665a}
.seg button.on{background:#1a1a1a;color:#f5ede3;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.btn{background:#1a1a1a;color:#f5ede3;border-radius:12px;padding:11px 16px;font-size:14px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn.gold{background:#1a1a1a;color:#f5ede3}
.btn.ghost{background:transparent;color:#1a1a1a;border:1px solid #d9ccb8}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}
.btn.danger{background:transparent;color:#b3412e;border:1px solid #e6c2b9}
.btn.ok{background:#ede3d5;color:#1a1a1a}
.btn:active{transform:scale(.97)}
.btn.full{width:100%}
.inp{width:100%;background:#faf6f0;border:1px solid #e0d4c2;border-radius:12px;padding:11px 12px;outline:none;transition:border-color .15s,box-shadow .15s}
input.inp,textarea.inp{-webkit-appearance:none;appearance:none}
.inp:focus{border-color:#1a1a1a;box-shadow:0 0 0 3px rgba(26,26,26,.12)}
textarea.inp{min-height:96px;resize:vertical;line-height:1.5}
.lbl{display:block;font-size:11px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:#8c8274;margin-bottom:6px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.fld{margin-bottom:10px}
.muted{color:#8c8274}
.small{font-size:12.5px}
.amt{font-family:'Playfair Display',serif;font-weight:700}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:#1a1a1a;color:#f5ede3;padding:12px 18px;border-radius:999px;font-size:14px;font-weight:600;opacity:0;transition:all .25s;z-index:90;pointer-events:none;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.loading{padding:80px 0;text-align:center;color:#8c8274;font-weight:600;letter-spacing:1px}
.spin{width:28px;height:28px;border:3px solid #e0d4c2;border-top-color:#1a1a1a;border-radius:50%;animation:sp .8s linear infinite;margin:0 auto 14px}
@keyframes sp{to{transform:rotate(360deg)}}
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.navb{width:42px;height:42px;border-radius:13px;background:#1a1a1a;color:#f5ede3;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.navb svg{width:18px;height:18px}
.cal-m{font-family:'Playfair Display',serif;font-size:23px;font-weight:700;text-align:center;line-height:1.1}
.cal-tb{font-size:12px;font-weight:700;color:#1a1a1a;text-decoration:underline;text-underline-offset:3px;display:block;margin:3px auto 0}
.legend{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none}
.legend::-webkit-scrollbar{display:none}
.lg{display:inline-flex;align-items:center;gap:6px;background:#fffcf7;border:1px solid #e9dfd1;border-radius:999px;padding:5px 10px;font-size:12px;white-space:nowrap;font-weight:600}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-bottom:16px}
.cal .dh .wide{display:inline}
@media (max-width:560px){.cal .dh .wide{display:none}}
.cal .dh{text-align:center;font-size:11px;font-weight:700;letter-spacing:1px;color:#8c8274;text-transform:uppercase;padding:4px 0}
.cd{background:#fffcf7;border:1px solid #ece2d4;border-radius:12px;min-height:68px;padding:5px;text-align:left;display:flex;flex-direction:column;gap:2px;overflow:hidden;align-items:stretch;justify-content:flex-start}
.cd.o{background:transparent;border-color:transparent;opacity:.35}
.cd.we{background:#f8f1e7}
.cd .n{font-size:12px;font-weight:700;color:#6f665a;display:flex;align-items:center;gap:3px;min-height:18px}
.cd.t .num{background:#1a1a1a;color:#f5ede3;border-radius:6px;padding:0 5px}
.cd.sel{background:#1a1a1a;border-color:#1a1a1a}
.cd.sel .n{color:#f5ede3}
.cd .nt{width:6px;height:6px;border-radius:50%;background:#1a1a1a;margin-left:auto}
.cd .otm{font-size:8px;font-weight:800;color:#1a1a1a}
.pills{display:flex;flex-direction:column;gap:2px}
.pill{font-size:10px;font-weight:600;color:#fff;border-radius:4px;padding:1px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dots{display:none;flex-wrap:wrap;gap:3px;margin-top:2px}
.dots i{width:8px;height:8px;border-radius:50%}
.more{font-size:9.5px;color:#8c8274;font-weight:700}
.cd.sel .more{color:#c9b9a0}
@media (max-width:560px){.pills{display:none}.dots{display:flex}.cd{min-height:56px;border-radius:10px;padding:4px}}
.entry{display:flex;align-items:center;gap:8px;padding:7px 4px 7px 12px;background:#faf6f0;border-radius:14px;border-left:6px solid #999;margin-bottom:8px}
.entry .f{flex:1;min-width:0}
.entry .p{font-weight:700;font-size:14.5px;display:inline}
.entry .j{display:inline;margin-left:6px}
.entry .tag{margin-right:5px}
.entry .j{font-size:13px;color:#5f574c}
.ib{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#8c8274;flex-shrink:0}
.ib svg{width:17px;height:17px}
.ib.on{background:#1a1a1a;color:#f5ede3}
.tag{font-size:10.5px;font-weight:700;border-radius:6px;padding:2px 7px;background:#ede3d5;color:#5f574c;display:inline-block;margin-top:2px;margin-right:4px}
.tag.ot{background:#1a1a1a;color:#f5ede3}
.tag.dir{background:#1a1a1a;color:#f5ede3}
.tag.g{background:#1a1a1a;color:#f5ede3}
.note-o{background:#f3ebdf;border-radius:14px;padding:12px 14px;font-size:14.5px;white-space:pre-wrap}
.tk{display:flex;gap:12px;align-items:flex-start;padding:12px 2px;border-top:1px solid #efe6d9;width:100%;text-align:left}
.tk:first-child{border-top:none}
.ck{width:25px;height:25px;border-radius:8px;border:2px solid #d4c5ae;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:#fff;transition:all .15s}
.ck svg{width:14px;height:14px;opacity:0;color:#fff}
.tk.d .ck{background:#1a1a1a;border-color:#1a1a1a}
.tk.d .ck svg{opacity:1}
.tk .tx{flex:1;font-size:14.5px;min-width:0}
.tk.d .tx .tt{color:#9a9083;text-decoration:line-through}
.tk .when{font-size:12px;color:#6f665a;font-weight:700;margin-top:2px;display:block}
.tk .meta{font-size:12px;color:#8c8274;margin-top:2px;display:block}
.tk.ro{cursor:default}
.sec-h{display:flex;align-items:baseline;gap:10px;margin-bottom:4px}
.sec-h .t{font-family:'Playfair Display',serif;font-size:20px;font-weight:700}
.sec-h .c{margin-left:auto;font-size:13px;font-weight:700}
.banner{background:#1a1a1a;color:#f5ede3;border-radius:14px;padding:11px 14px;font-size:13.5px;margin-bottom:14px}
.banner b{color:#ffffff}
.red{color:#b3412e}
.msgs{display:flex;flex-direction:column;gap:6px;max-height:320px;overflow-y:auto;margin-bottom:10px}
.bub{max-width:82%;padding:9px 13px;border-radius:18px;font-size:14.5px;line-height:1.4;word-wrap:break-word}
.bub.mine{align-self:flex-end;background:#1a1a1a;color:#f5ede3;border-bottom-right-radius:6px}
.bub.th{align-self:flex-start;background:#ede3d5;border-bottom-left-radius:6px}
.bub .m{font-size:10.5px;opacity:.6;margin-top:3px}
.compose{display:flex;gap:8px}
.total{background:#1a1a1a;color:#f5ede3;border-radius:20px;padding:16px 18px;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.total .k{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:#b5ab9c;font-weight:700}
.total .v{font-family:'Playfair Display',serif;font-size:30px;font-weight:700;line-height:1.1}
.total .s{font-size:12.5px;color:#b5ab9c;margin-top:2px}
.ln{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:7px 0;border-top:1px dashed #e4d8c7}
.ln:first-child{border-top:none}
.ln.tot{border-top:1px solid #1a1a1a;font-weight:700;font-size:15px;padding-top:10px;margin-top:4px}
.hint{font-size:12px;color:#6f665a;font-weight:700}
details.hist{border-top:1px solid #efe6d9}
details.hist:first-of-type{border-top:none}
details.hist summary{list-style:none;display:flex;justify-content:space-between;padding:12px 0;font-weight:600;font-size:14.5px;cursor:pointer}
details.hist summary::-webkit-details-marker{display:none}
.mrow{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid #efe6d9}
.mrow:first-child{border-top:none}
.mav{width:40px;height:40px;border-radius:50%;background:#1a1a1a;color:#f5ede3;display:flex;align-items:center;justify-content:center;font-family:'Playfair Display',serif;font-weight:700;font-size:14px;flex-shrink:0}
.sw{width:30px;height:30px;border-radius:9px;flex-shrink:0}
.fatal{text-align:center;padding:40px 10px}
.fatal .card-t{margin-bottom:10px}
.steps{padding-left:18px;font-size:14px;line-height:1.7}

.tally{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.tc{background:#1a1a1a;color:#f5ede3;border-radius:16px;padding:11px 14px}
.tc .k{font-size:11px;letter-spacing:1.6px;text-transform:uppercase;color:#b5ab9c;font-weight:700}
.tc .v{font-family:'Playfair Display',serif;font-size:25px;font-weight:700;line-height:1.1;margin-top:4px}
.tc .s{font-size:12px;color:#b5ab9c}
.clip{background:#1a1a1a;color:#f5ede3;border-radius:14px;padding:10px 12px 10px 14px;font-size:13.5px;display:flex;align-items:center;gap:10px;margin-bottom:14px}
.wd{display:flex;gap:12px;width:100%;text-align:left;background:#fffcf7;border:1px solid #e9dfd1;border-radius:16px;padding:12px 12px 12px 8px;margin-bottom:8px;align-items:flex-start;min-height:62px}
.wd.t{border:2px solid #1a1a1a}
.wd.we{background:#f8f1e7}
.wd .dt{width:46px;flex-shrink:0;text-align:center}
.wd .dt .a{font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#8c8274}
.wd .dt .b{font-family:'Playfair Display',serif;font-size:25px;font-weight:700;line-height:1.1}
.wd.t .dt .b{color:#1a1a1a}
.wd .es{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;padding-top:2px}
.ec{display:flex;align-items:stretch;gap:8px;font-size:14px;line-height:1.3}
.ec .sq{width:4px;border-radius:2px;flex-shrink:0}
.ec .et{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ec .j{color:#6f665a}
.wd .nn{font-size:12.5px;color:#6f665a;font-style:italic;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;margin-bottom:10px}
.mg .dh{text-align:center;font-size:11px;font-weight:700;color:#8c8274;padding:2px 0}
.mc{height:58px;background:#fffcf7;border:1px solid #ece2d4;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:3px;position:relative}
.mc.o{visibility:hidden}
.mc.we{background:#f8f1e7}
.mc.t{border:2px solid #1a1a1a}
.mc .d{font-size:15px;font-weight:700}
.mc .cnt{font-size:10px;font-weight:700;color:#8c8274}
.mc .sb{display:flex;width:72%;height:5px;border-radius:3px;overflow:hidden;gap:1px}
.mc .sb i{flex:1}
.mc .nt{position:absolute;top:5px;right:5px;width:6px;height:6px;border-radius:50%;background:#1a1a1a}
.sheet-bg{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(26,26,26,.45);z-index:70;opacity:0;pointer-events:none;transition:opacity .22s}
.sheet-bg.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:71;max-width:760px;margin:0 auto;background:#f5ede3;border-radius:24px 24px 0 0;transform:translateY(105%);transition:transform .26s ease;box-shadow:0 -12px 40px rgba(0,0,0,.25)}
.sheet.on{transform:none}
#sheet-in{display:flex;flex-direction:column;max-height:90vh}
.sh-h{padding:10px 16px 12px;border-bottom:1px solid #e4d8c7;flex-shrink:0}
.grab{width:42px;height:5px;border-radius:3px;background:#d4c5ae;margin:0 auto 10px}
.sh-b{overflow-y:auto;padding:14px 16px calc(28px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch;min-height:0;flex:1}
.note-v{background:#fffcf7;border:1px solid #e9dfd1;border-radius:14px;padding:12px 14px;font-size:15px;white-space:pre-wrap;line-height:1.5;word-wrap:break-word}
body.lock{overflow:hidden}

.dock{display:flex;align-items:center;gap:10px;background:#fbeee9;border-radius:10px;padding:6px 6px 6px 12px;margin-bottom:6px;font-size:14px}
.tgl{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:14px;font-weight:600}
.tgl input{width:20px;height:20px;accent-color:#1a1a1a}
.toast.act{pointer-events:auto;display:flex;align-items:center;gap:14px;padding:8px 8px 8px 18px}
.toast button{background:#f5ede3;color:#1a1a1a;border-radius:999px;padding:7px 14px;font-weight:700;font-size:13.5px}
.offline{display:none;background:#b3412e;color:#fff;font-size:13px;font-weight:600;text-align:center;padding:7px 12px}
</style>

/* ==== helpers ==== */
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function pad(n){ return String(n).padStart(2,'0'); }
function ymd(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function parse(k){ return new Date(k+'T12:00:00'); }
function noon(d){ return new Date(d.getFullYear(), d.getMonth(), d.getDate(), 12); }
function addDays(d,n){ var x = noon(d); x.setDate(x.getDate()+n); return x; }
function mondayOf(d){ var x = noon(d), day = x.getDay(); return addDays(x, day === 0 ? -6 : 1 - day); }
function todayKey(){ var d = noon(new Date()), day = d.getDay(); if (day === 0) d = addDays(d,-2); if (day === 6) d = addDays(d,-1); return ymd(d); }
function weekKey(){ return ymd(mondayOf(new Date())); }
function monthKey(){ var d = new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1); }

function num(v){ var n = parseFloat(v); return isNaN(n) ? 0 : n; }
function gbp(n){ return '\u00a3' + (Math.round((n||0)*100)/100).toLocaleString('en-GB',{minimumFractionDigits:2, maximumFractionDigits:2}); }
function fmt(d,o){ return d.toLocaleDateString('en-GB', o); }
function short(d){ return fmt(d,{weekday:'short',day:'numeric',month:'short'}); }
function dm(d){ return fmt(d,{day:'numeric',month:'short'}); }
function daysTxt(n){ return (Math.round(n*10)/10) + (n === 1 ? ' day' : ' days'); }
function other(u){ return u === 'macauly' ? 'brad' : 'macauly'; }
function initials(name){ return String(name||'?').trim().split(/\s+/).map(function(p){ return p.charAt(0); }).join('').slice(0,2).toUpperCase(); }
function memberById(id){ for (var i=0;i<S.team.length;i++) if (S.team[i].id === id) return S.team[i]; return null; }
function nameOf(u){ var m = memberById(u); return m ? m.name : USERS[u].name; }
function rateOfName(name){ for (var i=0;i<S.team.length;i++) if (S.team[i].name === name) return num(S.team[i].dayRate); return 0; }
function colour(id){
  var c = S.colours.filter(function(x){ return x.id === id; })[0] || DEFAULT_COLOURS.filter(function(x){ return x.id === id; })[0];
  return c || {id:0, hex:'#9a9285', label:'', payDays:0};
}
function colourLabel(id){ var c = colour(id); return c.label || ('Colour ' + (c.id || '')); }
function payDaysOf(id){
  var c = S.colours.filter(function(x){ return x.id === id; })[0];
  if (c && c.payDays !== undefined) return num(c.payDays);
  var d = DEFAULT_COLOURS.filter(function(x){ return x.id === id; })[0];
  return d ? d.payDays : 0;
}
function timeTxt(ts){
  var d = new Date(ts), t = d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
  return ymd(d) === ymd(new Date()) ? t : fmt(d,{weekday:'short'}) + ' ' + t;
}
function lastFri(y,m){ var d = new Date(y, m+1, 0, 12); while (d.getDay() !== 5) d = addDays(d,-1); return d; }

function toast(msg){ var t = $('toast'); t.textContent = msg; t.classList.remove('act'); t.classList.add('on'); clearTimeout(toast._t); toast._t = setTimeout(function(){ t.classList.remove('on'); }, 2200); }
var undoFn = null;
function toastUndo(msg, fn){
  var t = $('toast'); undoFn = fn;
  t.innerHTML = '<span>' + esc(msg) + '</span><button onclick="A.undo()">Undo</button>';
  t.classList.add('on','act'); clearTimeout(toast._t);
  toast._t = setTimeout(function(){ t.classList.remove('on','act'); undoFn = null; }, 5500);
}
function doUndo(){ var f = undoFn; undoFn = null; var t = $('toast'); t.classList.remove('on','act'); clearTimeout(toast._t); if (f) f(); }
function setSync(ok){ var s = $('sync'); if (s) s.className = ok ? '' : 'off'; }

/* ==== saving (field-level merge so nothing else in the document is touched) ==== */
function save(docName, data, msg){
  if (blocked || !ready || !db) { toast('Not connected \u2014 nothing saved'); return Promise.resolve(false); }
  var p = db.collection('app').doc(docName).set(data, {merge:true}).then(function(){ setSync(true); return true; }).catch(function(e){
    console.error('Save failed', docName, e); setSync(false); toast('Save failed \u2014 check your signal'); return false;
  });
  if (!navigator.onLine) { toast('Saved on this phone \u2014 it\u2019ll sync when you\u2019re back in signal'); return Promise.resolve(true); }
  return p.then(function(ok){ if (ok && msg) toast(msg); return ok; });
}
function setOffline(){ var off = !navigator.onLine, b = $('offline'); if (b) b.style.display = off ? 'block' : 'none'; setSync(!off); }
window.addEventListener('online', function(){ setOffline(); toast('Back online \u2014 syncing'); });
window.addEventListener('offline', setOffline);

function applyDoc(name, d){
  if (name === 'tasks') S.tasks = d || {};
  else if (name === 'notes') S.notes = d || {};
  else if (name === 'calendar') S.cal = d || {};
  else if (name === 'nudges') S.nudges = (d && d.list) || [];
  else if (name === 'paylog') S.paylog = d || {};
  else if (name === 'team') { if (d && d.members) S.team = d.members; }
  else if (name === 'colours') { if (d && d.list) S.colours = d.list; }
  else if (name === 'jobs') S.jobs = d || {};
  else if (name === 'todos') S.todos = d || {};
  else if (name === 'directorpay') S.dpay = d || {};
  else if (name === 'settings') S.cfg = d || {};
}

function loadAll(){
  if (!db) return Promise.reject(new Error('Firebase did not load'));
  return Promise.all(DOCS.map(function(p){ return db.collection('app').doc(p).get(); })).then(function(snaps){
    resetState();
    snaps.forEach(function(s,i){ applyDoc(DOCS[i], s.exists ? s.data() : null); });
    ready = true; blocked = false;
    lastToastTs = Date.now();
    DOCS.forEach(function(p){
      unsubs.push(db.collection('app').doc(p).onSnapshot(function(s){
        if (!s.exists) return;
        applyDoc(p, s.data()); setSync(true);
        softRender();
      }, function(e){ console.error('Listen', p, e); setSync(false); }));
    });
    backupDaily();
  });
}

function backupDaily(){
  var t = ymd(new Date());
  if (ls('pp_lastBackup') === t) return;
  if (!Object.keys(S.cal).length && !Object.keys(S.notes).length) return;
  var slot = 'backup_' + ['sun','mon','tue','wed','thu','fri','sat'][new Date().getDay()];
  db.collection('app').doc(slot).set({
    date:t, by:me, ts:Date.now(), calendar:S.cal, notes:S.notes, paylog:S.paylog, team:S.team,
    colours:S.colours, jobs:S.jobs, todos:S.todos, directorpay:S.dpay, nudges:S.nudges, settings:S.cfg
  }).then(function(){ ls('pp_lastBackup', t); }).catch(function(e){ console.warn('Backup skipped', e); });
}

function downloadBackup(){
  var data = {exported:new Date().toISOString(), by:me, tasks:S.tasks, notes:S.notes, calendar:S.cal, nudges:S.nudges, paylog:S.paylog, team:S.team, colours:S.colours, jobs:S.jobs, todos:S.todos, directorpay:S.dpay};
  var blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'pp-backup-' + ymd(new Date()) + '.json';
  document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  toast('Backup downloaded');
}

/* ==== rendering ==== */
function isEditing(){ var a = document.activeElement; return !!(a && a.closest && a.closest('main, #sheet') && /INPUT|TEXTAREA|SELECT/.test(a.tagName)); }
function softRender(){ if (!ready) return; if (isEditing()) { ui.pending = true; return; } render(); }
document.addEventListener('focusout', function(){ setTimeout(function(){ if (ui.pending && !isEditing()) render(); }, 200); });

function render(){
  if (!ready) return;
  ui.pending = false;
  var p = PAGES.filter(function(x){ return x.id === ui.page; })[0] || PAGES[0];
  $('menu-label').textContent = p.label;
  var html = {home:rHome, calendar:rCalendar, tasks:rTasks, paylog:rPay, settings:rSettings}[p.id]();
  $('main').innerHTML = html;
  if (p.id === 'calendar' && ui.openAfter) { var oa = ui.openAfter; ui.openAfter = null; openDay(oa); }
  else if (ui.sheetDay) renderSheet();
  updateBadge();
}
function unread(){ var lr = num(ls('pp_read_' + me)); return S.nudges.filter(function(n){ return n.to === me && (n.ts||0) > lr; }).length; }
function updateBadge(){ $('menu-badge').style.display = 'none'; buildMenu(); }
function checkNewMsg(){
  var mine = S.nudges.filter(function(n){ return n.to === me && (n.ts||0) > lastToastTs; });
  if (!mine.length) return;
  var last = mine[mine.length-1]; lastToastTs = last.ts;
  toast(nameOf(last.from) + ': ' + String(last.message).slice(0,60));
}

function buildMenu(){
  $('drop').innerHTML = PAGES.map(function(p, i){
    return (i === 1 ? '<div class="sep"></div>' : '') +
      '<button class="' + (ui.page === p.id ? 'act' : '') + '" onclick="A.go(\'' + p.id + '\')"><span class="ic">' + IC[p.id] + '</span><span><span class="t">' + p.label +
      '' + '</span><span class="s">' + p.sub + '</span></span></button>';
  }).join('');
}
function toggleMenu(){ var on = !$('drop').classList.contains('on'); buildMenu(); $('drop').classList.toggle('on', on); $('scrim').classList.toggle('on', on); $('menu-btn').classList.toggle('open', on); }
function closeMenu(){ $('drop').classList.remove('on'); $('scrim').classList.remove('on'); $('menu-btn').classList.remove('open'); }
function go(page){ closeMenu(); if (location.hash !== '#' + page) location.hash = page; else { render(); window.scrollTo(0,0); } }
window.addEventListener('hashchange', function(){
  var p = (location.hash || '#home').slice(1);
  ui.page = PAGES.some(function(x){ return x.id === p; }) ? p : 'home';

function head(eyebrow, title, sub){ return '<div class="phead"><div class="eyebrow">' + eyebrow + '</div><div class="ptitle">' + title + '</div>' + (sub ? '<div class="psub">' + sub + '</div>' : '') + '</div>'; }
function seg(items, cur, fn){ return '<div class="seg">' + items.map(function(it){ return '<button class="' + (it[0] === cur ? 'on' : '') + '" onclick="A.' + fn + '(\'' + it[0] + '\')">' + it[1] + '</button>'; }).join('') + '</div>'; }

/* ==== tasks data ==== */
function isDone(u,f,i){ var k = periodKeys()[f]; return !!(S.tasks[u] && S.tasks[u][f] && S.tasks[u][f][k] && S.tasks[u][f][k][i] === true); }
function doneAt(u,f,i){ var k = periodKeys()[f], t = S.tasks._times; return (t && t[u] && t[u][f] && t[u][f][k] && t[u][f][k][i]) || 0; }
function stats(u,f){ var t = TASKS[u][f], d = 0; for (var i=0;i<t.length;i++) if (isDone(u,f,i)) d++; return {done:d, total:t.length}; }
function toggleTask(u,f,i){
  if (u !== me) return;
  var k = periodKeys()[f], v = !isDone(u,f,i), ts = v ? Date.now() : 0;
  if (!S.tasks[u]) S.tasks[u] = {}; if (!S.tasks[u][f]) S.tasks[u][f] = {}; if (!S.tasks[u][f][k]) S.tasks[u][f][k] = {};
  S.tasks[u][f][k][i] = v;
  if (!S.tasks._times) S.tasks._times = {}; var T = S.tasks._times;
  if (!T[u]) T[u] = {}; if (!T[u][f]) T[u][f] = {}; if (!T[u][f][k]) T[u][f][k] = {};
  T[u][f][k][i] = ts;
  var a = {}; a[u] = {}; a[u][f] = {}; a[u][f][k] = {}; a[u][f][k][i] = v;
  a._times = {}; a._times[u] = {}; a._times[u][f] = {}; a._times[u][f][k] = {}; a._times[u][f][k][i] = ts;
  save('tasks', a);
  render();
}
function recentDone(){
  var out = [];
  ['macauly','brad'].forEach(function(u){ ['daily','weekly','monthly'].forEach(function(f){
    TASKS[u][f].forEach(function(txt,i){ var ts = doneAt(u,f,i); if (ts && isDone(u,f,i)) out.push({u:u, f:f, txt:txt, ts:ts}); });
  }); });
  return out.sort(function(a,b){ return b.ts - a.ts; });
}
function todoList(){ return Object.keys(S.todos).map(function(id){ var t = S.todos[id]; return t ? Object.assign({id:id}, t) : null; }).filter(function(t){ return t && t.text; }); }
function sortTodos(a,b){ return (a.due || '9999') < (b.due || '9999') ? -1 : (a.due || '9999') > (b.due || '9999') ? 1 : (a.createdAt||0) - (b.createdAt||0); }

/* ==== HOME ==== */
function nextPayDay(){ var t = noon(new Date()), L = lastFri(t.getFullYear(), t.getMonth()); if (ymd(t) > ymd(L)) { var n = new Date(t.getFullYear(), t.getMonth()+1, 1, 12); L = lastFri(n.getFullYear(), n.getMonth()); } return L; }
function monthTally(){
  var now = noon(new Date()), p = payMonthOfWeek(mondayOf(now)), per = payPeriod(p), res = {p:p, per:per};
  var n = Math.round((now - per.start) / 86400000) + 1;
  ['macauly','brad'].forEach(function(u){ res[u] = personDays(nameOf(u), per.start, n).days; });
  return res;
}
function tallyHtml(){
  var t = monthTally(), mn = fmt(new Date(t.p.y, t.p.m, 1, 12),{month:'long'});
  return '<div class="tally">' + ['macauly','brad'].map(function(u){
    return '<div class="tc"><div class="k">' + esc(nameOf(u)) + '</div><div class="v">' + (Math.round(t[u]*10)/10) + '<span style="font-size:14px;font-family:Barlow,sans-serif;font-weight:600;color:#b5ab9c"> ' + (t[u] === 1 ? 'day' : 'days') + '</span></div><div class="s">towards ' + mn + ' pay</div></div>';
  }).join('') + '</div><div class="small muted" style="margin:-6px 0 14px 2px">' + mn + ' pay covers w/c ' + dm(t.per.start) + ' \u2013 ' + dm(addDays(t.per.end,-2)) + ', paid ' + short(t.per.payDate) + '</div>';
}
function rHome(){
  var now = new Date(), h = now.getHours();
  var greet = h < 12 ? 'Morning' : h < 17 ? 'Afternoon' : 'Evening';
  var tk = ymd(now), today = (S.cal[tk] || []);
  var pd = nextPayDay(), dTo = Math.round((pd - noon(now)) / 86400000);
  var mine = stats(me,'daily');
  var crewWk = 0, pk0 = periodKey(0);
  weekEntries(pk0).forEach(function(e){ if (e._show) crewWk += netAmt(e); });
  var openTodos = todoList().filter(function(t){ return t.for === me && !t.done; }).sort(sortTodos);
  var html = '<div class="phead"><div class="eyebrow">' + fmt(now,{weekday:'long', day:'numeric', month:'long'}) + '</div><div class="ptitle">' + greet + ', ' + esc(nameOf(me)) + '</div></div>';
  html += '<div class="chips"><span class="chip">' + IC.clock.replace('<svg','<svg width="15" height="15"') + (dTo === 0 ? '<b>Your pay day today</b>' : 'Your pay in <b>' + dTo + ' day' + (dTo === 1 ? '' : 's') + '</b>') + ' &middot; ' + short(pd) + '</span>' +
    '<span class="chip l">Lads paid ' + short(payDayOf(pk0)) + '</span>' +
    (openTodos.length ? '<span class="chip l">' + openTodos.length + ' to-do' + (openTodos.length === 1 ? '' : 's') + ' for you</span>' : '') + '</div>';
  html += tallyHtml();
  html += '<div class="tiles">' +
    tile('calendar', 'Calendar', today.length ? today.length + ' on the calendar today' : 'Nothing booked today', true) +
    tile('tasks', 'Tasks', mine.done + ' of ' + mine.total + ' daily done') +
    tile('paylog', 'Pay Log', 'Lads ' + fmt(payDayOf(pk0),{weekday:'short', day:'numeric', month:'short'}) + ' \u00b7 ' + gbp(crewWk)) +
    tile('settings', 'Settings', 'Team, jobs, colours') + '</div>';
  html += '<div class="card"><div class="card-h"><div class="card-t">Today</div><button class="link" onclick="A.calOpen(\'' + tk + '\')">Open day</button></div>';
  if (!today.length) html += '<div class="empty">Nothing on the calendar for today.</div>';
  today.forEach(function(e){ html += '<div class="li"><span class="dot" style="background:' + colour(e.colourId||0).hex + '"></span><div class="f"><div class="a">' + esc(personLabel(e.person, true)) + '</div><div class="b">' + esc(e.job) + ' &middot; ' + esc(colourLabel(e.colourId||0)) + '</div></div></div>'; });
  ['macauly','brad'].filter(function(u){ return S.notes[u] && S.notes[u][tk]; }).forEach(function(u){ html += '<div class="li"><span class="dot" style="background:#1a1a1a"></span><div class="f"><div class="a">' + esc(nameOf(u)) + '\u2019s note</div><div class="b" style="white-space:pre-wrap">' + esc(S.notes[u][tk]) + '</div></div></div>'; });
  html += '</div>';
  html += '<div class="card"><div class="card-h"><div class="card-t">Task progress</div><button class="link" onclick="A.go(\'tasks\')">View all</button></div>';
  ['macauly','brad'].forEach(function(u){
    html += '<div style="margin:6px 0 12px"><div class="row" style="margin-bottom:8px"><div class="mav" style="width:30px;height:30px;font-size:11px">' + USERS[u].ini + '</div><b>' + esc(nameOf(u)) + (u === me ? ' <span class="muted small">(you)</span>' : '') + '</b></div><div class="g3">';
    ['daily','weekly','monthly'].forEach(function(f){ var s = stats(u,f), pct = s.total ? Math.round(s.done/s.total*100) : 0;
      html += '<div><div class="row small" style="justify-content:space-between;margin-bottom:4px"><span class="muted">' + f.charAt(0).toUpperCase() + f.slice(1) + '</span><b>' + s.done + '/' + s.total + '</b></div><div class="bar' + (pct === 100 ? ' g' : '') + '"><i style="width:' + pct + '%"></i></div></div>'; });
    html += '</div></div>';
  });
  var rd = recentDone().slice(0,5);
  if (rd.length) {
    html += '<div class="lbl" style="margin-top:14px">Recently done</div>';
    rd.forEach(function(r){ html += '<div class="li"><span class="dot" style="background:#1a1a1a"></span><div class="f"><div class="b" style="color:#1a1a1a">' + esc(r.txt) + '</div><div class="small muted">' + esc(nameOf(r.u)) + ' &middot; ' + timeTxt(r.ts) + '</div></div></div>'; });
  }
  html += '</div>';
  html += '<div class="card"><div class="card-h"><div class="card-t">Your to-dos</div><button class="link" onclick="A.taskWho(\'' + other(me) + '\')">Set one for ' + esc(nameOf(other(me))) + '</button></div>';
  if (!openTodos.length) html += '<div class="empty">All clear.</div>';
  openTodos.slice(0,5).forEach(function(t){ html += todoRow(t, true); });
  if (openTodos.length > 5) html += '<button class="link" onclick="A.taskWho(\'' + me + '\')">+' + (openTodos.length-5) + ' more</button>';
  html += '</div>';
  return html;
}
function tile(id, t, s, dark){ return '<button class="tile' + (dark ? ' dark' : '') + '" onclick="A.go(\'' + id + '\')"><span class="ic">' + IC[id] + '</span><span class="t">' + t + '</span><span class="s">' + s + '</span></button>'; }

/* ==== CALENDAR ==== */
function personLabel(p, full){ if (p === GENERAL) return 'Everyone'; return full ? String(p) : String(p).split(' ')[0]; }
function hasNote(k){ return (S.notes.macauly && S.notes.macauly[k]) || (S.notes.brad && S.notes.brad[k]) || ''; }
function calOpen(dk){ var d = parse(dk); ui.calY = d.getFullYear(); ui.calM = d.getMonth(); ui.weekStart = ymd(mondayOf(d)); ui.openAfter = dk; go('calendar'); }
function legendHtml(){ return '<div class="legend" style="margin-top:6px">' + S.colours.filter(function(c){ return c.label; }).map(function(c){ return '<span class="lg"><span class="dot" style="background:' + c.hex + ';width:9px;height:9px"></span>' + esc(c.label) + '</span>'; }).join('') + '</div>'; }
function rCalendar(){
  var now = new Date();
  if (ui.calY === null) { ui.calY = now.getFullYear(); ui.calM = now.getMonth(); }
  if (!ui.weekStart) ui.weekStart = ymd(mondayOf(now));
  var h = head('Team calendar', 'Calendar');
  h += tallyHtml();
  if (ui.clip) h += '<div class="clip"><span style="flex:1">Copied <b>' + short(parse(ui.clip.from)) + '</b> (' + ui.clip.entries.length + ') \u2014 open any day and tap Paste</span><button class="btn sm" onclick="A.clearClip()">Clear</button></div>';
  h += seg([['week','Week'], ['month','Month']], ui.calView, 'calView');
  h += ui.calView === 'month' ? rMonth() : rWeek();
  h += legendHtml();
  return h;
}
function entryChip(e){
  var c = colour(e.colourId||0), lab = (e.colourId||0) !== 1 ? ' &middot; ' + esc(colourLabel(e.colourId||0)) : '';
  return '<div class="ec"><span class="sq" style="background:' + c.hex + '"></span><span class="et"><b>' + esc(personLabel(e.person)) + '</b> <span class="j">' + esc(e.job) + lab + '</span>' + (num(e.otHours) > 0 ? ' <span class="tag ot" style="margin:0">OT</span>' : '') + '</span></div>';
}

/* ==== PAY LOG ==== */
function blank(v){ return v === '' || v === null || v === undefined; }
function memberByName(n){ for (var i=0;i<S.team.length;i++) if (S.team[i].name === n) return S.team[i]; return null; }
function dockTotal(e){ return (e.docks || []).reduce(function(s,d){ return s + Math.abs(num(d.amt)); }, 0); }
function calcEntry(e){ var base = e.basis === 'price-work' ? num(e.priceTotal) : num(e.days) * num(e.rate); return base + num(e.otHours) * num(e.otRate) - dockTotal(e); }
function cisRate(e){ var c = e.cis; if (blank(c)) { var m = memberById(e.personId) || memberByName(e.name); c = m && !blank(m.cis) ? m.cis : '20'; } return num(c); }
function cisAmt(e){ var g = calcEntry(e); return g > 0 ? Math.round(g * cisRate(e)) / 100 : 0; }
function netAmt(e){ return calcEntry(e) - cisAmt(e); }
function personDays(name, start, n){
  var r = {days:0, otH:0, ot:0};
  for (var i=0;i<n;i++) { (S.cal[ymd(addDays(start,i))] || []).forEach(function(e){
    if (e.person !== name) return;
    r.days += payDaysOf(e.colourId||0);
    var h = num(e.otHours); if (h > 0) { r.otH += h; r.ot += h * num(e.otRate); }
  }); }
  return r;
}
function personJobs(name, mon, span){
  var m = {}, order = [];
  for (var i=0;i<(span||7);i++) (S.cal[ymd(addDays(mon,i))] || []).forEach(function(e){
    if (e.person !== name) return; var pd = payDaysOf(e.colourId||0); if (pd <= 0) return;
    var j = String(e.job || '').trim() || 'No job'; if (!(j in m)) { m[j] = 0; order.push(j); } m[j] += pd;
  });
  return order.map(function(j){ return {job:j, days:m[j]}; });
}
function calPeopleWeek(mon, span){
  var out = [], seen = {};
  for (var i=0;i<(span||7);i++) (S.cal[ymd(addDays(mon,i))] || []).forEach(function(e){
    if (e.person === GENERAL || seen[e.person]) return;
    if (payDaysOf(e.colourId||0) > 0 || num(e.otHours) > 0) { seen[e.person] = true; out.push(e.person); }
  });
  return out;
}
function isDirName(n){ return n === nameOf('macauly') || n === nameOf('brad'); }
function slug(n){ return 'n_' + String(n).toLowerCase().replace(/[^a-z0-9]+/g,'_'); }
function weekEntries(wk){
  var span = spanOf(wk), mon = keyMon(wk), list = S.paylog[wk] ? clone(S.paylog[wk]) : [], onCal = calPeopleWeek(mon, span);
  onCal.forEach(function(name){
    if (isDirName(name)) return;

      h += '<div class="mrow"><div class="mav">' + esc(m.initials || initials(m.name)) + '</div><div style="flex:1;min-width:0"><div style="font-weight:700">' + esc(m.name) + (m.isDirector ? ' <span class="tag dir">Director</span>' : '') + '</div><div class="small muted">' + esc(m.role || '') + (num(m.dayRate) ? ' \u00b7 ' + gbp(num(m.dayRate)) + '/day' : '') + (m.isDirector ? '' : ' \u00b7 ' + (blank(m.cis) || num(m.cis) === 20 ? 'CIS 20%' : num(m.cis) === 0 ? 'Gross' : 'CIS ' + num(m.cis) + '%')) + '</div></div>' +
        '<button class="ib" onclick="A.editMember(\'' + m.id + '\')" aria-label="Edit">' + IC.edit + '</button>' + (m.isDirector ? '' : '<button class="ib" onclick="A.removeMember(\'' + m.id + '\')" aria-label="Remove">' + IC.x + '</button>') + '</div>';
    }
  });
  h += '</div><div class="card"><div class="card-t" style="margin-bottom:12px">Add someone</div><div class="g2 fld"><input class="inp" id="nm-name" placeholder="Name"><input class="inp" id="nm-role" placeholder="Role e.g. Dryliner"></div><div class="row"><input class="inp" id="nm-rate" type="number" inputmode="decimal" step="0.01" placeholder="Day rate \u00a3 (optional)"><button class="btn" onclick="A.addMember()">Add</button></div></div>';
  return h;
}
function saveTeam(msg){ return save('team', {members:S.team}, msg); }
function editMember(id){ ui.editM = id; render(); }
function saveMember(id){
  var m = memberById(id), name = $('em-name').value.trim(); if (!m || !name) return;
  m.name = name; m.role = $('em-role').value.trim() || 'Operative'; m.dayRate = $('em-rate').value; m.initials = initials(name);
  if ($('em-cis')) m.cis = $('em-cis').value; if ($('em-utr')) m.utr = $('em-utr').value.trim();
  if ($('em-phone')) { var pv = $('em-phone').value.trim(); if (pv && !normPhone(pv)) { toast('That mobile number doesn\u2019t look right'); return; } m.phone = pv; }
  ui.editM = null; saveTeam('Saved'); render();
}
function addMember(){
  var name = $('nm-name').value.trim(); if (!name) { $('nm-name').focus(); return; }
  S.team.push({id:'op_' + Date.now(), name:name, initials:initials(name), role:$('nm-role').value.trim() || 'Operative', isDirector:false, dayRate:$('nm-rate').value});
  saveTeam(name + ' added'); render();
}
function removeMember(id){
  var m = memberById(id); if (!m || m.isDirector) return;
  if (!confirm('Remove ' + m.name + ' from the team? Their past calendar and pay history stays.')) return;
  S.team = S.team.filter(function(x){ return x.id !== id; }); saveTeam('Removed'); render();
}
function jobStats(){
  var map = {};
  Object.keys(S.cal).forEach(function(k){ (S.cal[k] || []).forEach(function(e){
    var j = String(e.job || '').trim(); if (!j) return;
    var key = j.toLowerCase(); if (!map[key]) map[key] = {name:j, days:0, cost:0, ot:0, people:{}, first:k, last:k};
    var s = map[key], pd = payDaysOf(e.colourId||0), otv = num(e.otHours) * num(e.otRate);
    s.days += pd; s.ot += otv; s.cost += pd * rateOfName(e.person) + otv;
    if (pd > 0) s.people[e.person] = (s.people[e.person] || 0) + pd;
    if (k < s.first) s.first = k; if (k > s.last) s.last = k;
  }); });
  return map;
}
function jobList(){ return Object.keys(S.jobs).map(function(id){ var j = S.jobs[id]; return j ? Object.assign({id:id}, j) : null; }).filter(function(j){ return j && j.name; }).sort(function(a,b){ return (b.createdAt||0) - (a.createdAt||0); }); }
function activeJobs(){ return jobList().filter(function(j){ return j.status !== 'finished'; }); }
function rJobs(){
  var st = jobStats(), jobs = jobList(), listed = {};
  jobs.forEach(function(j){ listed[j.name.trim().toLowerCase()] = true; });
  var h = '<div class="card"><div class="card-t" style="margin-bottom:4px">Add a job</div><div class="small muted fld">Jobs show up as suggestions when you add to the calendar, and add up labour days and cost from it.</div>' +
    '<div class="g2 fld"><input class="inp" id="nj-name" placeholder="Job / site name"><input class="inp" id="nj-client" placeholder="Client (optional)"></div><button class="btn full" onclick="A.addJob()">Add job</button></div>';
  function jobCard(j){
    var s = st[j.name.trim().toLowerCase()] || {days:0, cost:0, ot:0, people:{}}, open = ui.openJob === j.id;
    var r = '<div class="card"><div class="card-h" style="margin-bottom:6px"><div style="min-width:0"><div class="card-t" style="font-size:18px">' + esc(j.name) + '</div><div class="small muted">' + esc(j.client || '') + (s.first ? (j.client ? ' \u00b7 ' : '') + dm(parse(s.first)) + ' \u2013 ' + dm(parse(s.last)) : '') + '</div></div>' + (j.status === 'finished' ? '<span class="tag g">Finished</span>' : '') + '</div>';
    r += (num(j.dirRate) > 0 ? '<div class="small" style="color:#1a1a1a;font-weight:700">Director rate ' + gbp(num(j.dirRate)) + ' a day</div>' : '') + '<div class="g2" style="margin:8px 0"><div><div class="lbl">Labour days</div><div class="amt" style="font-size:22px">' + (Math.round(s.days*10)/10) + '</div></div><div><div class="lbl">Labour cost</div><div class="amt" style="font-size:22px">' + gbp(s.cost) + '</div></div></div>';
    if (open) {
      var ppl = Object.keys(s.people);
      if (!ppl.length) r += '<div class="empty">Nobody booked on this job yet.</div>';
      ppl.forEach(function(p){ var rt = rateOfName(p); r += '<div class="ln"><span>' + esc(p) + '</span><span>' + daysTxt(s.people[p]) + (rt ? ' \u00b7 ' + gbp(s.people[p]*rt) : ' <span class="small muted">no rate set</span>') + '</span></div>'; });
      if (s.ot) r += '<div class="ln"><span>Overtime</span><span>' + gbp(s.ot) + '</span></div>';
      r += '<div class="small muted" style="margin-top:6px">Cost uses each person\u2019s day rate from Team.</div>';
    }
    r += '<div class="row" style="margin-top:10px"><button class="btn sm ghost" onclick="A.openJob(\'' + j.id + '\')">' + (open ? 'Hide' : 'Breakdown') + '</button><span class="sp"></span>' +
      (j.status === 'finished' ? '<button class="btn sm ghost" onclick="A.jobStatus(\'' + j.id + '\',\'active\')">Reopen</button>' : '<button class="btn sm ghost" onclick="A.jobStatus(\'' + j.id + '\',\'finished\')">Mark finished</button>') +
      '<button class="ib" onclick="A.delJob(\'' + j.id + '\')" aria-label="Delete">' + IC.x + '</button></div></div>';
    return r;
  }
  var act = jobs.filter(function(j){ return j.status !== 'finished'; }), fin = jobs.filter(function(j){ return j.status === 'finished'; });
  if (!jobs.length) h += '<div class="empty" style="margin-bottom:14px">No jobs added yet.</div>';
  act.forEach(function(j){ h += jobCard(j); });
  ui.unlisted = Object.keys(st).filter(function(k){ return !listed[k] && st[k].days > 0; }).map(function(k){ return st[k]; }).sort(function(a,b){ return b.last < a.last ? -1 : 1; });
  if (ui.unlisted.length) {
    h += '<div class="card"><div class="card-t" style="margin-bottom:4px">On the calendar, not in your jobs</div><div class="small muted fld">Tap add to start tracking them.</div>';
    ui.unlisted.slice(0,15).forEach(function(s, i){ h += '<div class="li"><div class="f"><div class="a">' + esc(s.name) + '</div><div class="b">' + daysTxt(s.days) + ' \u00b7 last ' + dm(parse(s.last)) + '</div></div><button class="btn sm" onclick="A.addUnlisted(' + i + ')">Add</button></div>'; });
    h += '</div>';
  }
  if (fin.length) { h += '<div class="eyebrow" style="margin:18px 0 10px">Finished jobs</div>'; fin.forEach(function(j){ h += jobCard(j); }); }
  return h;
}
function saveJob(id, data, msg){ var o = {}; o[id] = data; return save('jobs', o, msg); }
function addJob(name, client){
  name = name || $('nj-name').value.trim(); client = client === undefined ? ($('nj-client') ? $('nj-client').value.trim() : '') : client;
  if (!name) { $('nj-name').focus(); return; }
  var id = 'j' + Date.now(), j = {name:name, client:client || '', status:'active', createdAt:Date.now()};
  S.jobs[id] = j; saveJob(id, j, 'Job added'); render();
}
function addUnlisted(i){ var s = ui.unlisted[i]; if (s) addJob(s.name, ''); }
function jobStatus(id, st){ if (!S.jobs[id]) return; S.jobs[id].status = st; saveJob(id, {status:st}, st === 'finished' ? 'Marked finished' : 'Reopened'); render(); }
function delJob(id){ var j = S.jobs[id]; if (!j) return; delete S.jobs[id]; saveJob(id, FV.delete()); render(); toastUndo(j.name + ' removed from jobs', function(){ S.jobs[id] = j; saveJob(id, j); render(); }); }
function openJob(id){ ui.openJob = ui.openJob === id ? null : id; render(); }
function rColours(){
  if (!ui.colDraft) ui.colDraft = DEFAULT_COLOURS.map(function(dc){ var l = S.colours.filter(function(c){ return c.id === dc.id; })[0]; return Object.assign({}, dc, l || {}); });
  var h = '<div class="card"><div class="card-t" style="margin-bottom:4px">Calendar colours</div><div class="small muted fld">On Site counts as a full day of pay, Half Day as half. Everything else counts as no pay.</div>';
  ui.colDraft.forEach(function(c){
    var pd = num(DEFAULT_COLOURS.filter(function(d){ return d.id === c.id; })[0].payDays);
    h += '<div class="mrow"><span class="sw" style="background:' + c.hex + '"></span><input class="inp" value="' + esc(c.label) + '" placeholder="Name this colour\u2026" oninput="A.colLabel(' + c.id + ',this.value)"><span class="tag' + (pd > 0 ? ' g' : '') + '" style="margin:0;min-width:62px;text-align:center">' + (pd === 1 ? 'Full day' : pd === 0.5 ? 'Half day' : 'No pay') + '</span></div>';
  });
  h += '<div class="row" style="margin-top:14px"><button class="btn" onclick="A.saveColours()">Save colours</button><span class="sp"></span><button class="btn sm danger" onclick="A.resetColours()">Reset to defaults</button></div></div>';
  return h;
}
function colLabel(id, v){ ui.colDraft.forEach(function(c){ if (c.id === id) c.label = v; }); }
function saveColours(){
  var list = ui.colDraft.map(function(c){ var d = DEFAULT_COLOURS.filter(function(x){ return x.id === c.id; })[0]; return Object.assign({}, c, {payDays:d ? d.payDays : num(c.payDays)}); });
  S.colours = list; ui.colDraft = null; save('colours', {list:list}, 'Colours saved'); render();
}
function resetColours(){ if (!confirm('Reset all colour names to the defaults?')) return; ui.colDraft = clone(DEFAULT_COLOURS); saveColours(); }
function rApp(){
  var h = '<div class="card"><div class="card-h"><div class="row"><div class="mav">' + USERS[me].ini + '</div><div><div class="card-t" style="font-size:18px">' + esc(nameOf(me)) + '</div><div class="small muted">Logged in on this device</div></div></div><button class="btn sm ghost" onclick="A.logout()">Switch user</button></div></div>';
  h += '<div class="card"><div class="card-t" style="margin-bottom:8px">Add to home screen</div><div class="lbl">iPhone (Safari)</div><ol class="steps fld"><li>Tap the Share button</li><li>Tap <b>Add to Home Screen</b></li></ol><div class="lbl">Android (Chrome)</div><ol class="steps"><li>Tap the three dots, top right</li><li>Tap <b>Add to Home screen</b> or <b>Install app</b></li></ol></div>';
  h += '<div class="card"><div class="card-t" style="margin-bottom:6px">CIS details</div><div class="small muted fld">Shown on the monthly CIS statements. It\u2019s on your CIS letters from HMRC.</div><label class="lbl">Employer\u2019s reference</label><input class="inp" value="' + esc(S.cfg.empRef || '') + '" placeholder="e.g. 123/AB45678" onchange="A.setCfg(\'empRef\',this.value)"></div>';
  h += '<div class="card"><div class="card-t" style="margin-bottom:6px">Backups</div><div class="small muted fld">A copy of the calendar, notes, pay log, team and jobs is saved automatically once a day, keeping the last 7 days. You can also download a copy to keep yourself.</div><button class="btn full" onclick="A.downloadBackup()">Download backup now</button></div>';
  return h;
}

/* ==== login ==== */
function showFatal(err){
  $('main').innerHTML = '<div class="card fatal"><div class="card-t">Couldn\u2019t load your data</div><p class="muted fld">Nothing has been changed or deleted. Check your signal and try again. If it keeps happening, the Firebase security rules may have expired \u2014 the data is still there, it just can\u2019t be read until they\u2019re renewed.</p><p class="small muted fld">' + esc(err && err.message ? err.message : String(err)) + '</p><button class="btn" onclick="A.login(\'' + me + '\')">Try again</button></div>';
}
function login(u){
  unsubs.forEach(function(f){ f(); }); unsubs = []; ready = false; blocked = true;
  me = u; ls('pp_user', u);
  try { ui.clip = JSON.parse(ls('pp_clip') || 'null'); } catch(e) { ui.clip = null; }
  ui.taskWho = null; ui.page = (location.hash || '#home').slice(1); if (!PAGES.some(function(x){ return x.id === ui.page; })) ui.page = 'home';
  $('login').style.display = 'none'; $('app').style.display = 'block';
  $('me-ini').textContent = USERS[u].ini;
  $('main').innerHTML = '<div class="loading"><div class="spin"></div>Loading your data</div>';
  loadAll().then(function(){ render(); }).catch(function(e){ console.error(e); blocked = true; ready = false; setSync(false); showFatal(e); });
}
function logout(){
  unsubs.forEach(function(f){ f(); }); unsubs = []; ready = false; me = null;
  try { localStorage.removeItem('pp_user'); } catch(e) {}
  closeMenu(); if (ui.sheetDay) hideSheet(); $('app').style.display = 'none'; $('login').style.display = 'flex';
}
function openApp(){ ui.setTab = 'app'; go('settings'); }

window.A = {
  login:login, logout:logout, go:go, toggleMenu:toggleMenu, closeMenu:closeMenu, openApp:openApp, downloadBackup:downloadBackup,
  calOpen:calOpen, calMove:calMove, calToday:calToday, weekCal:weekCal, calView:function(v){ ui.calView = v; render(); }, openDay:openDay, closeDay:closeDay, moveDay:moveDay, copyDay:copyDay, pasteDay:pasteDay, clearClip:clearClip, noteEdit:noteEdit,
  addEntry:addEntry, runToggle:runToggle, undo:doUndo, addDock:addDock, delDock:delDock, addPayPerson:addPayPerson, removePayPerson:removePayPerson,
  payOpen:function(pid){ ui.payOpen = pid; render(); }, stmtWeek:stmtWeek, stmtCis:stmtCis, shareStmt:shareStmt, pdfStmt:pdfStmt, waStmt:waStmt, dlStmt:dlStmt, closeModal:closeModal, setCfg:function(k,v){ S.cfg[k] = v; var o = {}; o[k] = v; save('settings', o, 'Saved'); },
  removeEntry:removeEntry, otOpen:otOpen, otSave:otSave, saveNote:saveNote, setJobRate:setJobRate,
  taskWho:function(u){ ui.taskWho = u; if (ui.page !== 'tasks') go('tasks'); else render(); }, toggleTask:toggleTask, addTodo:addTodo, toggleTodo:toggleTodo, delTodo:delTodo,
  payTab:function(t){ ui.payTab = t; render(); }, payField:payField, weekMove:weekMove, dirField:dirField, dirPaid:dirPaid, monthMove:monthMove,
  setTab:function(t){ ui.setTab = t; ui.colDraft = null; render(); }, editMember:editMember, saveMember:saveMember, addMember:addMember, removeMember:removeMember,
  addJob:function(){ addJob(); }, addUnlisted:addUnlisted, jobStatus:jobStatus, delJob:delJob, openJob:openJob,
  colLabel:colLabel, saveColours:saveColours, resetColours:resetColours
};
window.__pp = {payPeriod:payPeriod, payMonthOfWeek:payMonthOfWeek, ymd:ymd, S:function(){ return S; }};

(function(){
  var sx = null, sy = null, ctx = null;
  function start(e, where){ var t = e.touches[0]; if (e.target.closest && e.target.closest('.legend, input, textarea, select')) { sx = null; return; } sx = t.clientX; sy = t.clientY; ctx = where; }
  function end(e){ if (sx === null) return; var t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy, w = ctx; sx = null;
    if (Math.abs(dx) < 70 || Math.abs(dy) > 55) return; var dir = dx < 0 ? 1 : -1;
    if (w === 'sheet') moveDay(dir); else if (ui.calView === 'month') calMove(dir); else weekCal(dir); }
  $('main').addEventListener('touchstart', function(e){ if (ui.page !== 'calendar' || ui.sheetDay) { sx = null; return; } start(e, 'cal'); }, {passive:true});
  $('main').addEventListener('touchend', end, {passive:true});
  $('sheet').addEventListener('touchstart', function(e){ if (!e.target.closest || !e.target.closest('.sh-h')) { sx = null; return; } start(e, 'sheet'); }, {passive:true});
  $('sheet').addEventListener('touchend', end, {passive:true});
})();
setOffline();
var saved = ls('pp_user');
if (saved === 'macauly' || saved === 'brad') login(saved); else $('login').style.display = 'flex';

});
