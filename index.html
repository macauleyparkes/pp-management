<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Perry &amp; Parkes</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Barlow:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #f5ede3; font-family: 'Barlow', sans-serif; min-height: 100vh; color: #2a2a26; }
#login-screen { min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:40px 20px; background:#f5ede3; }
.login-logo { text-align:center; margin-bottom:48px; }
.login-logo img { width:280px; max-width:90vw; display:block; margin:0 auto; }
.login-title { font-size:13px; color:#888; letter-spacing:2px; text-transform:uppercase; margin-bottom:36px; }
.profile-cards { display:flex; gap:20px; flex-wrap:wrap; justify-content:center; }
.profile-card { background:#fff; border:1px solid #d4c4a8; padding:32px 40px; cursor:pointer; text-align:center; min-width:170px; transition:all 0.2s; border-top:3px solid #d4c4a8; }
.profile-card:hover { border-top-color:#2a2a26; box-shadow:0 4px 20px rgba(0,0,0,0.08); transform:translateY(-2px); }
.profile-avatar { width:60px; height:60px; background:#1a1a1a; border-radius:50%; display:flex; align-items:center; justify-content:center; font-family:'Playfair Display',serif; font-weight:700; font-size:22px; color:#f5ede3; margin:0 auto 14px; }
.profile-card .name { font-family:'Playfair Display',serif; font-size:19px; color:#1a1a1a; font-weight:700; }
.profile-card .role-label { font-size:11px; color:#888; letter-spacing:1px; text-transform:uppercase; margin-top:5px; }
#app { display:none; min-height:100vh; background:#f5ede3; }
.app-header { background:#1a1a1a; padding:0 20px; display:flex; align-items:center; justify-content:space-between; height:58px; position:sticky; top:0; z-index:100; }
.header-logo-img { height:28px; display:block; }
.header-right { display:flex; align-items:center; gap:12px; }
.user-avatar-sm { width:30px; height:30px; background:#f5ede3; border-radius:50%; display:flex; align-items:center; justify-content:center; font-family:'Playfair Display',serif; font-weight:700; font-size:12px; color:#1a1a1a; }
.user-name-sm { font-size:13px; color:#f5ede3; font-weight:500; }
.switch-btn { background:transparent; border:1px solid rgba(245,237,227,0.4); color:#f5ede3; font-family:'Barlow',sans-serif; font-size:11px; letter-spacing:1px; text-transform:uppercase; padding:5px 12px; cursor:pointer; }
.sync-indicator { font-size:10px; color:#888; letter-spacing:1px; }
.sync-indicator.live { color:#2ecc71; }
.tab-bar { background:#1a1a1a; display:flex; border-bottom:1px solid rgba(245,237,227,0.15); padding:0 16px; overflow-x:auto; }
.tab { padding:13px 16px; font-size:12px; font-weight:500; color:rgba(245,237,227,0.5); cursor:pointer; border-bottom:2px solid transparent; white-space:nowrap; transition:all 0.15s; text-transform:uppercase; letter-spacing:0.5px; }
.tab:hover { color:#f5ede3; }
.tab.active { color:#f5ede3; border-bottom-color:#f5ede3; }
.app-body { max-width:920px; margin:0 auto; padding:26px 20px 70px; }
.view-header { margin-bottom:24px; }
.view-title { font-family:'Playfair Display',serif; font-size:26px; color:#1a1a1a; font-weight:700; }
.view-subtitle { font-size:13px; color:#666660; margin-top:3px; }
.loading-state { text-align:center; padding:60px 20px; color:#888; font-size:14px; letter-spacing:1px; }
.loading-state::after { content:''; display:inline-block; width:20px; height:20px; border:2px solid #d4c4a8; border-top-color:#1a1a1a; border-radius:50%; animation:spin 0.8s linear infinite; margin-left:10px; vertical-align:middle; }
@keyframes spin { to { transform:rotate(360deg); } }
.task-section { margin-bottom:28px; }
.section-header { display:flex; align-items:center; gap:10px; margin-bottom:10px; }
.section-label { font-size:11px; font-weight:700; letter-spacing:2.5px; text-transform:uppercase; color:#888; }
.section-rule { flex:1; height:1px; background:#d4c4a8; }
.section-count { font-size:11px; color:#888; }
.task-card { background:#fff; border:1px solid #d4c4a8; border-left:3px solid #d4c4a8; padding:13px 16px; margin-bottom:7px; display:flex; align-items:flex-start; gap:12px; transition:all 0.15s; cursor:pointer; user-select:none; }
.task-card:hover { border-color:#1a1a1a; }
.task-card.done { background:#f0f7f3; border-left-color:#2e7d52; opacity:0.85; }
.task-check { width:20px; height:20px; border:2px solid #d4c4a8; border-radius:3px; flex-shrink:0; margin-top:1px; display:flex; align-items:center; justify-content:center; background:white; font-size:12px; }
.task-card.done .task-check { background:#2e7d52; border-color:#2e7d52; color:white; }
.task-text { flex:1; font-size:14px; line-height:1.5; color:#2a2a26; }
.task-card.done .task-text { text-decoration:line-through; color:#888; }
.cal-nav { display:flex; align-items:center; gap:14px; margin-bottom:20px; }
.cal-nav-btn { background:#1a1a1a; color:#f5ede3; border:none; width:32px; height:32px; cursor:pointer; font-size:16px; display:flex; align-items:center; justify-content:center; }
.cal-nav-btn:hover { background:#2a2a26; }
.cal-month-label { font-family:'Playfair Display',serif; font-size:20px; font-weight:700; color:#1a1a1a; }
.cal-legend { display:flex; gap:10px; margin-bottom:12px; flex-wrap:wrap; }
.cal-legend-item { display:flex; align-items:center; gap:5px; font-size:11px; color:#666660; }
.cal-legend-dot { width:10px; height:10px; border-radius:2px; flex-shrink:0; }
.cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:1px; background:#d4c4a8; border:1px solid #d4c4a8; margin-bottom:24px; }
.cal-day-header { background:#1a1a1a; color:#f5ede3; font-size:11px; font-weight:600; letter-spacing:1px; text-transform:uppercase; text-align:center; padding:8px 2px; }
.cal-day { background:#fff; min-height:72px; padding:5px; cursor:pointer; transition:background 0.12s; overflow:hidden; }
.cal-day:hover { background:#f5ede3; }
.cal-day.other-month { background:#f0ebe6; }
.cal-day.today { outline:2px solid #1a1a1a; outline-offset:-2px; }
.cal-day.selected { background:#ede4d8; }
.cal-day-num { font-size:11px; font-weight:600; color:#666660; margin-bottom:3px; }
.cal-day.today .cal-day-num { color:#1a1a1a; font-weight:700; }
.entry-pill { font-size:9px; font-weight:600; padding:1px 4px; border-radius:2px; margin-bottom:2px; display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:white; }
.day-panel { background:#fff; border:1px solid #d4c4a8; margin-bottom:20px; }
.day-panel-header { background:#1a1a1a; padding:14px 18px; display:flex; align-items:center; justify-content:space-between; }
.day-panel-title { font-family:'Playfair Display',serif; font-size:16px; color:#f5ede3; font-weight:700; }
.day-panel-body { padding:18px; }
.add-entry-form { display:grid; grid-template-columns:1fr 1fr 1fr auto; gap:10px; align-items:end; margin-bottom:18px; }
.form-group label { display:block; font-size:11px; font-weight:600; letter-spacing:1px; text-transform:uppercase; color:#888; margin-bottom:5px; }
.form-group select, .form-group input { width:100%; border:1px solid #d4c4a8; background:#f9f5f0; font-family:'Barlow',sans-serif; font-size:13px; color:#2a2a26; padding:8px 10px; outline:none; }
.form-group select:focus, .form-group input:focus { border-color:#1a1a1a; }
.add-entry-btn { background:#1a1a1a; color:#f5ede3; border:none; font-family:'Barlow',sans-serif; font-size:12px; font-weight:600; letter-spacing:1px; text-transform:uppercase; padding:9px 16px; cursor:pointer; height:36px; white-space:nowrap; }
.add-entry-btn:hover { background:#2a2a26; }
.entries-list { display:flex; flex-direction:column; gap:8px; }
.entry-row { display:flex; align-items:center; gap:10px; padding:10px 14px; background:#f9f5f0; border:1px solid #d4c4a8; border-left:4px solid #999; }
.entry-person { font-weight:600; font-size:13px; color:#1a1a1a; min-width:90px; }
.entry-job { flex:1; font-size:13px; color:#2a2a26; }
.entry-remove { background:none; border:none; color:#aaa; cursor:pointer; font-size:16px; padding:0 4px; margin-left:auto; }
.entry-remove:hover { color:#c0392b; }
.no-entries { font-size:13px; color:#aaa; font-style:italic; text-align:center; padding:16px 0; }
.ot-cal-panel { border-top:1px solid #d4c4a8; margin-top:14px; padding-top:14px; }
.ot-cal-label { font-size:11px; font-weight:700; letter-spacing:2px; text-transform:uppercase; color:#888; margin-bottom:8px; }
.ot-cal-row { display:grid; grid-template-columns:1fr 1fr auto; gap:10px; align-items:end; }
.notes-panel { border-top:1px solid #d4c4a8; margin-top:18px; padding-top:18px; }
.notes-panel-label { font-size:11px; font-weight:700; letter-spacing:2px; text-transform:uppercase; color:#888; margin-bottom:8px; }
.notes-textarea { width:100%; min-height:90px; border:1px solid #d4c4a8; background:#f9f5f0; font-family:'Barlow',sans-serif; font-size:14px; color:#2a2a26; padding:10px 12px; resize:vertical; outline:none; line-height:1.5; }
.notes-textarea:focus { border-color:#1a1a1a; }
.notes-save-btn { margin-top:8px; background:#1a1a1a; color:#f5ede3; border:none; font-family:'Barlow',sans-serif; font-size:11px; font-weight:600; letter-spacing:1.5px; text-transform:uppercase; padding:8px 18px; cursor:pointer; }
.notes-save-btn:hover { background:#2a2a26; }
.saved-msg { font-size:11px; color:#2e7d52; margin-left:10px; opacity:0; transition:opacity 0.3s; }
.other-notes-box { margin-top:14px; background:#f9f5f0; border:1px solid #d4c4a8; padding:12px 14px; }
.other-notes-label { font-size:11px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase; color:#888; margin-bottom:6px; }
.other-notes-text { font-size:13px; color:#555; line-height:1.5; white-space:pre-wrap; }
.other-notes-empty { font-size:13px; color:#aaa; font-style:italic; }
.team-card { background:#fff; border:1px solid #d4c4a8; padding:22px; margin-bottom:18px; }
.team-card-header { display:flex; align-items:center; gap:14px; margin-bottom:18px; padding-bottom:14px; border-bottom:1px solid #d4c4a8; }
.team-avatar { width:44px; height:44px; background:#1a1a1a; border-radius:50%; display:flex; align-items:center; justify-content:center; font-family:'Playfair Display',serif; font-weight:700; font-size:18px; color:#f5ede3; }
.team-name { font-family:'Playfair Display',serif; font-size:19px; font-weight:700; color:#1a1a1a; }
.team-roles { font-size:12px; color:#888; margin-top:2px; }
.team-progress-row { display:flex; gap:10px; flex-wrap:wrap; }
.team-stat { flex:1; min-width:90px; background:#f5ede3; border:1px solid #d4c4a8; padding:10px 14px; text-align:center; }
.team-stat-val { font-family:'Playfair Display',serif; font-size:22px; font-weight:700; color:#1a1a1a; }
.team-stat-label { font-size:10px; color:#888; letter-spacing:1px; text-transform:uppercase; margin-top:2px; }
.leaderboard-card { background:#1a1a1a; border:2px solid #f5ede3; padding:22px; margin-bottom:22px; }
.leaderboard-title { font-family:'Playfair Display',serif; font-size:20px; color:#f5ede3; font-weight:700; margin-bottom:18px; text-align:center; letter-spacing:1px; }
.leaderboard-row { display:flex; align-items:center; gap:14px; padding:14px 0; border-bottom:1px solid rgba(245,237,227,0.2); }
.leaderboard-row:last-child { border-bottom:none; }
.leaderboard-pos { font-family:'Playfair Display',serif; font-size:28px; font-weight:900; color:#f5ede3; min-width:36px; }
.leaderboard-pos.second { color:#888; }
.leaderboard-avatar { width:44px; height:44px; background:#f5ede3; border-radius:50%; display:flex; align-items:center; justify-content:center; font-family:'Playfair Display',serif; font-weight:700; font-size:16px; color:#1a1a1a; flex-shrink:0; }
.leaderboard-avatar.second { background:#555; color:#f5ede3; }
.leaderboard-info { flex:1; }
.leaderboard-name { font-family:'Playfair Display',serif; font-size:17px; color:#f5ede3; font-weight:700; }
.leaderboard-streaks { display:flex; gap:8px; margin-top:5px; flex-wrap:wrap; }
.streak-badge { display:flex; align-items:center; gap:4px; background:rgba(245,237,227,0.1); border:1px solid rgba(245,237,227,0.25); padding:3px 9px; border-radius:2px; }
.streak-badge.active { background:rgba(245,237,227,0.2); border-color:#f5ede3; }
.streak-val { font-family:'Playfair Display',serif; font-size:14px; font-weight:700; color:#f5ede3; }
.streak-label { font-size:10px; color:#999; letter-spacing:1px; text-transform:uppercase; }
.streak-fire { font-size:13px; }
.leaderboard-score { text-align:right; }
.leaderboard-total { font-family:'Playfair Display',serif; font-size:26px; font-weight:900; color:#f5ede3; line-height:1; }
.leaderboard-total.second { color:#888; }
.leaderboard-pts { font-size:10px; color:#999; letter-spacing:1px; text-transform:uppercase; }
.nudge-section { background:#fff; border:1px solid #d4c4a8; padding:22px; margin-bottom:16px; }
.nudge-title { font-family:'Playfair Display',serif; font-size:17px; font-weight:700; color:#1a1a1a; margin-bottom:14px; }
.nudge-messages { max-height:220px; overflow-y:auto; margin-bottom:12px; border:1px solid #d4c4a8; padding:10px; background:#f9f5f0; }
.nudge-bubble { padding:8px 12px; margin-bottom:8px; border-radius:2px; font-size:13px; line-height:1.4; max-width:80%; }
.nudge-bubble.mine { background:#1a1a1a; color:#f5ede3; margin-left:auto; }
.nudge-bubble.theirs { background:#f0ebe6; color:#2a2a26; }
.nudge-bubble-meta { font-size:10px; opacity:0.6; margin-top:3px; }
.nudge-compose { display:flex; gap:8px; }
.nudge-input { flex:1; border:1px solid #d4c4a8; background:#f9f5f0; font-family:'Barlow',sans-serif; font-size:13px; color:#2a2a26; padding:8px 10px; outline:none; }
.nudge-input:focus { border-color:#1a1a1a; }
.nudge-btn { background:#1a1a1a; color:#f5ede3; border:none; font-family:'Barlow',sans-serif; font-size:11px; font-weight:600; letter-spacing:1px; text-transform:uppercase; padding:7px 14px; cursor:pointer; }
.nudge-btn:hover { background:#2a2a26; }
.manage-section { background:#fff; border:1px solid #d4c4a8; margin-bottom:20px; }
.manage-header { background:#1a1a1a; padding:12px 18px; }
.manage-header-title { font-size:12px; font-weight:700; letter-spacing:2px; text-transform:uppercase; color:#f5ede3; }
.manage-body { padding:18px; }
.member-row { display:flex; align-items:center; gap:12px; padding:10px 0; border-bottom:1px solid #d4c4a8; }
.member-row:last-child { border-bottom:none; }
.member-av { width:34px; height:34px; background:#1a1a1a; border-radius:50%; display:flex; align-items:center; justify-content:center; font-family:'Playfair Display',serif; font-weight:700; font-size:13px; color:#f5ede3; flex-shrink:0; }
.member-name { font-size:14px; font-weight:600; color:#1a1a1a; }
.member-role { font-size:11px; color:#888; }
.type-badge { font-size:10px; font-weight:700; letter-spacing:1px; text-transform:uppercase; padding:2px 8px; border-radius:2px; flex-shrink:0; }
.type-badge.director { background:#1a1a1a; color:#f5ede3; }
.type-badge.operative { background:#d4c4a8; color:#2a2a26; }
.rm-btn { background:none; border:1px solid rgba(192,57,43,0.3); color:#c0392b; font-family:'Barlow',sans-serif; font-size:11px; padding:4px 10px; cursor:pointer; }
.rm-btn:hover { background:#c0392b; color:white; border-color:#c0392b; }
.add-member-form { display:grid; grid-template-columns:1fr 1fr auto; gap:10px; align-items:end; margin-top:16px; padding-top:16px; border-top:1px solid #d4c4a8; }
.paylog-week-selector { display:flex; align-items:center; gap:14px; margin-bottom:22px; }
.paylog-week-label { font-family:'Playfair Display',serif; font-size:18px; font-weight:700; color:#1a1a1a; }
.paylog-input { border:1px solid #d4c4a8; background:#f9f5f0; font-family:'Barlow',sans-serif; font-size:13px; color:#2a2a26; padding:5px 7px; width:100%; outline:none; }
.paylog-input:focus { border-color:#1a1a1a; }
.cal-days-info { font-size:11px; color:#2471a3; font-style:italic; }
.paylog-save-row { display:flex; align-items:center; gap:12px; margin-top:4px; margin-bottom:28px; }
.paylog-history { background:#fff; border:1px solid #d4c4a8; }
.paylog-history-header { background:#1a1a1a; padding:12px 16px; }
.paylog-history-title { font-size:12px; font-weight:700; letter-spacing:2px; text-transform:uppercase; color:#f5ede3; }
.paylog-hist-week { border-bottom:1px solid #d4c4a8; }
.paylog-hist-week:last-child { border-bottom:none; }
.paylog-hist-week-label { padding:10px 16px; font-weight:600; font-size:13px; color:#888; background:#f5ede3; border-bottom:1px solid #d4c4a8; }
.paylog-hist-row { display:flex; align-items:center; padding:9px 16px; border-bottom:1px solid #d4c4a8; gap:12px; }
.paylog-hist-row:last-child { border-bottom:none; }
.paylog-hist-name { font-weight:600; font-size:13px; color:#1a1a1a; min-width:130px; }
.paylog-hist-detail { font-size:12px; color:#888; flex:1; }
.paylog-hist-amount { font-family:'Playfair Display',serif; font-size:15px; font-weight:700; color:#1a1a1a; }
.basis-badge { font-size:9px; font-weight:700; letter-spacing:1px; text-transform:uppercase; padding:2px 6px; border-radius:2px; }
.basis-badge.day-rate { background:#1a1a1a; color:#f5ede3; }
.basis-badge.price-work { background:#d4c4a8; color:#2a2a26; }
.ot-label { font-size:10px; font-weight:700; letter-spacing:1px; text-transform:uppercase; color:#2a2a26; margin-bottom:3px; }
.settings-section { background:#fff; border:1px solid #d4c4a8; margin-bottom:20px; }
.settings-header { background:#1a1a1a; padding:12px 18px; }
.settings-header-title { font-size:12px; font-weight:700; letter-spacing:2px; text-transform:uppercase; color:#f5ede3; }
.settings-body { padding:18px; }
.colour-row { display:flex; align-items:center; gap:12px; padding:9px 0; border-bottom:1px solid #d4c4a8; }
.colour-row:last-child { border-bottom:none; }
.colour-swatch { width:28px; height:28px; border-radius:4px; flex-shrink:0; border:2px solid rgba(0,0,0,0.1); }
.colour-input { flex:1; border:1px solid #d4c4a8; background:#f9f5f0; font-family:'Barlow',sans-serif; font-size:13px; color:#2a2a26; padding:6px 10px; outline:none; }
.colour-input:focus { border-color:#1a1a1a; }
.notif-bar { position:fixed; top:66px; right:16px; background:#1a1a1a; border:1px solid #f5ede3; border-left:4px solid #f5ede3; padding:12px 32px 12px 14px; max-width:280px; z-index:999; box-shadow:0 8px 32px rgba(0,0,0,0.2); }
.notif-from { font-size:10px; color:#f5ede3; letter-spacing:1px; text-transform:uppercase; margin-bottom:3px; }
.notif-msg { font-size:13px; color:#f5ede3; line-height:1.4; }
.notif-close { position:absolute; top:8px; right:8px; background:none; border:none; color:#888; cursor:pointer; font-size:14px; }
@media(max-width:600px){
  .profile-cards{flex-direction:column;align-items:center;}
  .app-body{padding:16px 12px 70px;}
  .add-entry-form{grid-template-columns:1fr 1fr;}
  .add-member-form{grid-template-columns:1fr;}
  .team-progress-row{gap:6px;}
  .cal-day{min-height:52px;}
  .ot-cal-row{grid-template-columns:1fr 1fr;}
}
</style>
</head>

const todayKey=()=>{ const d=new Date(),day=d.getDay(); if(day===0)d.setDate(d.getDate()-2); if(day===6)d.setDate(d.getDate()-1); return d.toISOString().split('T')[0]; };
const weekKey=()=>{ const d=new Date(),day=d.getDay(),diff=d.getDate()-day+(day===0?-6:1); return new Date(new Date().setDate(diff)).toISOString().split('T')[0]; };
const monthKey=()=>{ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); };
const fmtDate=(y,m,d)=>y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
const keys=()=>({daily:todayKey(),weekly:weekKey(),monthly:monthKey()});

function dbDoc(path){const p=path.split('/');return db.collection(p[0]).doc(p[1]);}
async function fbSet(path,data){try{await dbDoc(path).set(data);}catch(e){console.error('Save:',e);}}
async function fbGet(path,def){try{const s=await dbDoc(path).get();return s.exists?s.data():def;}catch(e){console.error('Read:',e);return def;}}
function fbListen(path,cb){const u=dbDoc(path).onSnapshot(s=>{if(s.exists)cb(s.data());},e=>console.error('Listen:',e));unsubscribers.push(u);return u;}

const isV=v=>{const e=document.getElementById('view-'+v);return e&&e.style.display!=='none';};

function isAllDone(u,f){const k=keys()[f];return TASKS[u][f].every((_,i)=>taskState[u]?.[f]?.[k]?.[i]===true);}

async function checkAndUpdateStreaks(){
  const dk=todayKey(),wk=weekKey(),mk=monthKey();
  if(!streaks[currentUser])streaks[currentUser]={daily:{streak:0,lastKey:'',longestDaily:0},weekly:{streak:0,lastKey:'',longestWeekly:0},monthly:{streak:0,lastKey:'',longestMonthly:0},totalPoints:0};
  const s=streaks[currentUser]; let changed=false;
  if(isAllDone(currentUser,'daily')&&s.daily.lastKey!==dk){
    const yk=new Date(new Date().setDate(new Date().getDate()-1)).toISOString().split('T')[0];
    s.daily.streak=s.daily.lastKey===yk?s.daily.streak+1:1; s.daily.lastKey=dk;
    if(s.daily.streak>(s.daily.longestDaily||0))s.daily.longestDaily=s.daily.streak; changed=true;
  }
  if(isAllDone(currentUser,'weekly')&&s.weekly.lastKey!==wk){s.weekly.streak=(s.weekly.streak||0)+1;s.weekly.lastKey=wk;if(s.weekly.streak>(s.weekly.longestWeekly||0))s.weekly.longestWeekly=s.weekly.streak;changed=true;}
  if(isAllDone(currentUser,'monthly')&&s.monthly.lastKey!==mk){s.monthly.streak=(s.monthly.streak||0)+1;s.monthly.lastKey=mk;if(s.monthly.streak>(s.monthly.longestMonthly||0))s.monthly.longestMonthly=s.monthly.streak;changed=true;}
  if(!streaks.macauly)streaks.macauly={daily:{streak:0},weekly:{streak:0},monthly:{streak:0}};
  if(!streaks.brad)streaks.brad={daily:{streak:0},weekly:{streak:0},monthly:{streak:0}};
  streaks.macauly.totalPoints=((streaks.macauly.daily||{}).streak||0)+((streaks.macauly.weekly||{}).streak||0)*5+((streaks.macauly.monthly||{}).streak||0)*20;
  streaks.brad.totalPoints=((streaks.brad.daily||{}).streak||0)+((streaks.brad.weekly||{}).streak||0)*5+((streaks.brad.monthly||{}).streak||0)*20;
  if(changed)await fbSet('app/streaks',streaks);
}

const isTaskDone=(u,f,i)=>taskState[u]?.[f]?.[keys()[f]]?.[i]===true;
const getStats=(u,f)=>{const t=TASKS[u][f];return{done:t.filter((_,i)=>isTaskDone(u,f,i)).length,total:t.length};};

async function toggleTask(u,f,i){
  if(u!==currentUser)return;
  const k=keys()[f];
  if(!taskState[u])taskState[u]={};
  if(!taskState[u][f])taskState[u][f]={};
  if(!taskState[u][f][k])taskState[u][f][k]={};
  taskState[u][f][k][i]=!taskState[u][f][k][i];
  await fbSet('app/tasks',taskState);
  await checkAndUpdateStreaks();
  renderTasks();
}

function renderTasks(){
  const u=currentUser;
  let html=`<div class="view-header"><div class="view-title">${u==='macauly'?'Macauly':'Brad'}'s Tasks</div><div class="view-subtitle">${u==='macauly'?'Operations · Sales · Marketing':'General · Site · Finance'}</div></div>`;
  ['daily','weekly','monthly'].forEach(freq=>{
    const tasks=TASKS[u][freq],st=getStats(u,freq);
    html+=`<div class="task-section"><div class="section-header"><div class="section-label">${freq.charAt(0).toUpperCase()+freq.slice(1)}</div><div class="section-rule"></div><div class="section-count">${st.done}/${st.total}</div></div>`;
    tasks.forEach((text,idx)=>{
      const done=isTaskDone(u,freq,idx);
      html+=`<div class="task-card${done?' done':''}" onclick="toggleTask('${u}','${freq}',${idx})"><div class="task-check">${done?'&#x2713;':''}</div><div class="task-text">${text}</div></div>`;
    });
    html+='</div>';
  });
  document.getElementById('view-tasks').innerHTML=html;
}

const getColour=id=>{const c=colourLabels.find(c=>c.id===id);return c?c.hex:'#999';};

function renderCalendar(){
  const now=new Date();
  if(calYear===undefined){calYear=now.getFullYear();calMonth=now.getMonth();}
  const firstDay=new Date(calYear,calMonth,1).getDay();
  const daysInMonth=new Date(calYear,calMonth+1,0).getDate();
  const startOffset=(firstDay===0)?6:firstDay-1;
  const mNames=['January','February','March','April','May','June','July','August','September','October','November','December'];
  const dNames=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  const realToday=new Date().toISOString().split('T')[0];

  const legendHtml=colourLabels.filter(c=>c.label).map(c=>`<div class="cal-legend-item"><div class="cal-legend-dot" style="background:${c.hex}"></div>${c.label}</div>`).join('');

  let html=`<div class="view-header"><div class="view-title">Team Calendar</div><div class="view-subtitle">Jobs, rotas, and notes</div></div><div class="cal-legend">${legendHtml}</div><div class="cal-nav"><button class="cal-nav-btn" onclick="changeMonth(-1)">&#8249;</button><div class="cal-month-label">${mNames[calMonth]} ${calYear}</div><button class="cal-nav-btn" onclick="changeMonth(1)">&#8250;</button></div><div class="cal-grid">${dNames.map(d=>`<div class="cal-day-header">${d}</div>`).join('')}`;

  const prevDays=new Date(calYear,calMonth,0).getDate();
  for(let i=startOffset-1;i>=0;i--)html+=`<div class="cal-day other-month"><div class="cal-day-num">${prevDays-i}</div></div>`;

  for(let d=1;d<=daysInMonth;d++){
    const dk=fmtDate(calYear,calMonth,d);
    const entries=calEntries[dk]||[];
    const hasNote=notes[currentUser]&&notes[currentUser][dk];
    const hasOT=entries.some(e=>e.otHours&&parseFloat(e.otHours)>0);
    html+=`<div class="cal-day${dk===realToday?' today':''}${dk===selectedCalDate?' selected':''}" onclick="selectCalDay('${dk}')"><div class="cal-day-num">${d}${hasNote?' <span style="color:#2a2a26;font-size:9px;">&#9679;</span>':''}${hasOT?' <span style="color:#e67e22;font-size:9px;">OT</span>':''}</div>${entries.slice(0,3).map(e=>`<span class="entry-pill" style="background:${getColour(e.colourId||0)}">${e.person.split(' ')[0]}</span>`).join('')}${entries.length>3?`<span style="font-size:9px;color:#888">+${entries.length-3}</span>`:''}</div>`;
  }
  const totalCells=Math.ceil((startOffset+daysInMonth)/7)*7;
  for(let i=1;i<=totalCells-startOffset-daysInMonth;i++)html+=`<div class="cal-day other-month"><div class="cal-day-num">${i}</div></div>`;
  html+='</div>';

  if(selectedCalDate){
    const entries=calEntries[selectedCalDate]||[];
    const displayDate=new Date(selectedCalDate+'T12:00:00').toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
    const mOpts='<option value="— General —">— General —</option>'+teamMembers.map(m=>`<option value="${m.name}">${m.name}</option>`).join('');
    const cOpts=colourLabels.map(c=>`<option value="${c.id}">${c.label||'Colour '+c.id}</option>`).join('');
    const prevDK=(()=>{const pd=new Date(selectedCalDate+'T12:00:00');pd.setDate(pd.getDate()-1);return pd.toISOString().split('T')[0];})();
    const prevE=calEntries[prevDK]||[];
    const myNote=notes[currentUser]&&notes[currentUser][selectedCalDate]?notes[currentUser][selectedCalDate]:'';
    const other=currentUser==='macauly'?'brad':'macauly';
    const otherName=other==='macauly'?'Macauly':'Brad';
    const otherNote=notes[other]&&notes[other][selectedCalDate]?notes[other][selectedCalDate]:'';
    const dayOTHours=entries.reduce((s,e)=>s+(parseFloat(e.otHours)||0),0);
    const dayOTRate=entries.length>0&&entries[0].otRate?entries[0].otRate:'';

    html+=`<div class="day-panel"><div class="day-panel-header"><div class="day-panel-title">${displayDate}</div>${prevE.length>0?`<button onclick="copyPrevDay('${selectedCalDate}','${prevDK}')" style="background:#f5ede3;color:#1a1a1a;border:none;font-family:'Barlow',sans-serif;font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;padding:6px 12px;cursor:pointer;">Copy Previous Day</button>`:''}</div><div class="day-panel-body"><div class="add-entry-form"><div class="form-group"><label>Person</label><select id="cal-person">${mOpts}</select></div><div class="form-group"><label>Note / Job</label><input type="text" id="cal-job" placeholder="e.g. AWE Site"/></div><div class="form-group"><label>Colour</label><select id="cal-colour">${cOpts}</select></div><button class="add-entry-btn" onclick="addCalEntry()">+ Add</button></div><div class="entries-list">${entries.length===0?'<div class="no-entries">No entries for this day yet</div>':entries.map((e,i)=>`<div class="entry-row" style="border-left-color:${getColour(e.colourId||0)}"><div style="width:12px;height:12px;border-radius:50%;background:${getColour(e.colourId||0)};flex-shrink:0;"></div>${e.person!=='— General —'?`<div class="entry-person">${e.person}</div>`:''}<div class="entry-job">${e.job} <span style="font-size:11px;color:#888">${getColourLabel(e.colourId||0)}</span></div><button class="entry-remove" onclick="removeCalEntry(${i})">&#215;</button></div>`).join('')}</div><div class="ot-cal-panel"><div class="ot-cal-label">Overtime for this day</div><div class="ot-cal-row"><div class="form-group"><label>OT Hours</label><input type="number" id="cal-ot-hours" min="0" step="0.5" value="${dayOTHours||''}" placeholder="e.g. 2"/></div><div class="form-group"><label>OT Rate &pound;/hr</label><input type="number" id="cal-ot-rate" min="0" step="0.01" value="${dayOTRate}" placeholder="e.g. 37.50"/></div><button class="add-entry-btn" onclick="saveCalOT()">Save OT</button></div>${dayOTHours>0?`<div style="font-size:12px;color:#2a2a26;margin-top:6px;">OT total: &pound;${(dayOTHours*(parseFloat(dayOTRate)||0)).toFixed(2)}</div>`:''}</div><div class="notes-panel"><div class="notes-panel-label">Daily Notes</div><textarea class="notes-textarea" id="my-note-input" placeholder="Your notes for this day...">${myNote}</textarea><div style="display:flex;align-items:center;margin-top:8px;"><button class="notes-save-btn" onclick="saveNote()">Save Note</button><span class="saved-msg" id="notes-saved-msg">Saved &#x2713;</span></div>${otherNote?`<div class="other-notes-box"><div class="other-notes-label">${otherName}'s Note</div><div class="other-notes-text">${otherNote.replace(/</g,'&lt;')}</div></div>`:`<div class="other-notes-box"><div class="other-notes-label">${otherName}'s Note</div><div class="other-notes-empty">Nothing added for this day</div></div>`}</div></div></div>`;
  }
  document.getElementById('view-calendar').innerHTML=html;
}

async function saveCalOT(){
  const hours=document.getElementById('cal-ot-hours').value;
  const rate=document.getElementById('cal-ot-rate').value;
  if(!calEntries[selectedCalDate]||calEntries[selectedCalDate].length===0){alert('Add at least one person to this day first.');return;}
  calEntries[selectedCalDate].forEach((e,i)=>{if(i===0){e.otHours=hours;e.otRate=rate;}else{e.otHours='';e.otRate='';}});
  await fbSet('app/calendar',calEntries);
  // auto-update paylog
  const d=new Date(selectedCalDate+'T12:00:00'),day=d.getDay(),diff=d.getDate()-day+(day===0?-6:1);
  const wk=new Date(d.setDate(diff)).toISOString().split('T')[0];
  teamMembers.forEach(m=>{
    if(!(calEntries[selectedCalDate]||[]).some(e=>e.person===m.name))return;
    if(!payLog[wk])payLog[wk]=[];
    let entry=payLog[wk].find(e=>e.personId===m.id);
    if(!entry){entry={personId:m.id,name:m.name,role:m.role||'',days:'',rate:'',basis:'day-rate',priceTotal:'',otHours:hours,otRate:rate,note:'',amount:0};payLog[wk].push(entry);}
    else{entry.otHours=hours;entry.otRate=rate;entry.amount=calcEntryAmount(entry);}
  });
  await fbSet('app/paylog',payLog);
  renderCalendar();
}

async function saveNote(){
  const val=document.getElementById('my-note-input').value;
  if(!notes[currentUser])notes[currentUser]={};
  notes[currentUser][selectedCalDate]=val;
  await fbSet('app/notes',notes);
  const msg=document.getElementById('notes-saved-msg');
  msg.style.opacity='1';setTimeout(()=>msg.style.opacity='0',2000);
}

async function copyPrevDay(tgt,src){
  const sE=calEntries[src]||[];if(!sE.length)return;
  const ex=calEntries[tgt]||[];
  calEntries[tgt]=[...ex,...sE.filter(se=>!ex.some(e=>e.person===se.person&&e.job===se.job))];
  await fbSet('app/calendar',calEntries);renderCalendar();
}

function changeMonth(dir){calMonth+=dir;if(calMonth>11){calMonth=0;calYear++;}if(calMonth<0){calMonth=11;calYear--;}renderCalendar();}
function selectCalDay(dk){selectedCalDate=dk;renderCalendar();}

async function addCalEntry(){
  const person=document.getElementById('cal-person').value;
  const job=document.getElementById('cal-job').value.trim();
  const colourId=parseInt(document.getElementById('cal-colour').value);
  if(!job){document.getElementById('cal-job').focus();return;}
  if(!calEntries[selectedCalDate])calEntries[selectedCalDate]=[];
  calEntries[selectedCalDate].push({person,job,colourId});
  await fbSet('app/calendar',calEntries);renderCalendar();
}

async function removeCalEntry(idx){
  calEntries[selectedCalDate].splice(idx,1);
  await fbSet('app/calendar',calEntries);renderCalendar();
}

    const uN=u==='macauly'?'Macauly':'Brad',uI=u==='macauly'?'MP':'BP';
    const uR=u==='macauly'?'Operations · Sales · Marketing':'General · Site · Finance';
    const dy=getStats(u,'daily'),wk=getStats(u,'weekly'),mo=getStats(u,'monthly');
    const us=streaks[u]||{};
    html+=`<div class="team-card"><div class="team-card-header"><div class="team-avatar">${uI}</div><div><div class="team-name">${uN}</div><div class="team-roles">${uR}</div></div><div style="margin-left:auto;text-align:right;"><div style="font-size:10px;color:#888;letter-spacing:1px;text-transform:uppercase;">Daily Streak</div><div style="font-family:'Playfair Display',serif;font-size:22px;font-weight:700;color:#1a1a1a;">${(us.daily&&us.daily.streak)||0} &#128293;</div></div></div><div class="team-progress-row"><div class="team-stat"><div class="team-stat-val">${dy.done}/${dy.total}</div><div class="team-stat-label">Today</div></div><div class="team-stat"><div class="team-stat-val">${wk.done}/${wk.total}</div><div class="team-stat-label">This Week</div></div><div class="team-stat"><div class="team-stat-val">${mo.done}/${mo.total}</div><div class="team-stat-label">This Month</div></div></div></div>`;
  });
  const sd=document.createElement('div');renderStreaks(sd);html+=sd.innerHTML;
  const other=currentUser==='macauly'?'brad':'macauly';
  const otherName=other==='macauly'?'Macauly':'Brad';
  const msgs=[...nudges].sort((a,b)=>(a.ts||0)-(b.ts||0)).slice(-30);
  html+=`<div class="nudge-section"><div class="nudge-title">Messages with ${otherName}</div><div class="nudge-messages" id="nudge-msg-list">${msgs.length===0?'<div style="font-size:13px;color:#aaa;font-style:italic;text-align:center;padding:12px;">No messages yet</div>':msgs.map(n=>{const isMe=n.from===currentUser;const nm=n.from==='macauly'?'Macauly':'Brad';const t=n.ts?new Date(n.ts).toLocaleString('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):(n.date||'');return `<div style="display:flex;flex-direction:column;align-items:${isMe?'flex-end':'flex-start'};margin-bottom:6px;"><div class="nudge-bubble ${isMe?'mine':'theirs'}">${n.message}<div class="nudge-bubble-meta">${nm} &middot; ${t}</div></div></div>`;}).join('')}</div><div class="nudge-compose"><input class="nudge-input" id="nudge-input" placeholder="Type a message..." onkeydown="if(event.key==='Enter')sendNudge()"><button class="nudge-btn" onclick="sendNudge()">Send</button></div></div>`;
  const md=document.createElement('div');renderManage(md);html+=md.innerHTML;
  document.getElementById('view-team').innerHTML=html;
  const ml=document.getElementById('nudge-msg-list');if(ml)ml.scrollTop=ml.scrollHeight;
}

async function sendNudge(){
  const input=document.getElementById('nudge-input');
  const text=input.value.trim();if(!text)return;
  const other=currentUser==='macauly'?'brad':'macauly';
  nudges.push({from:currentUser,to:other,date:todayKey(),ts:Date.now(),message:text});
  await fbSet('app/nudges',{list:nudges});
  input.value='';renderTeam();
}

function renderManage(container){
  let html='<div class="manage-section"><div class="manage-header"><div class="manage-header-title">Team Members</div></div><div class="manage-body">';
  teamMembers.forEach((m,i)=>{
    const ed=editingMemberIdx===i;
    html+=`<div class="member-row"><div class="member-av">${m.initials}</div><div class="member-info" style="flex:1">${ed?`<input type="text" id="edit-name-${i}" value="${m.name}" style="border:1px solid #1a1a1a;background:#f9f5f0;font-family:'Barlow',sans-serif;font-size:13px;padding:4px 8px;width:100%;margin-bottom:4px;outline:none;"/><input type="text" id="edit-role-${i}" value="${m.role}" style="border:1px solid #d4c4a8;background:#f9f5f0;font-family:'Barlow',sans-serif;font-size:12px;padding:3px 8px;width:100%;outline:none;"/>`:`<div class="member-name">${m.name}</div><div class="member-role">${m.role}</div>`}</div><span class="type-badge ${m.isDirector?'director':'operative'}">${m.isDirector?'Director':'Operative'}</span>${!m.isDirector?(ed?`<button class="add-entry-btn" style="padding:5px 12px;font-size:11px;height:auto;margin-left:6px;" onclick="saveMemberEdit(${i})">Save</button><button class="rm-btn" style="margin-left:4px;" onclick="cancelMemberEdit()">Cancel</button>`:`<button class="rm-btn" style="margin-right:4px;" onclick="startMemberEdit(${i})">Rename</button><button class="rm-btn" onclick="removeMember(${i})">Remove</button>`):''}</div>`;
  });
  html+='<div class="add-member-form"><div class="form-group"><label>Name</label><input type="text" id="new-member-name" placeholder="e.g. John Smith"/></div><div class="form-group"><label>Role</label><input type="text" id="new-member-role" placeholder="e.g. Dryliner"/></div><button class="add-entry-btn" onclick="addMember()" style="align-self:flex-end">+ Add</button></div></div></div>';
  container.innerHTML=html;
}

async function addMember(){
  const name=document.getElementById('new-member-name').value.trim();
  const role=document.getElementById('new-member-role').value.trim();
  if(!name){document.getElementById('new-member-name').focus();return;}
  teamMembers.push({id:'op_'+Date.now(),name,initials:name.split(' ').map(p=>p[0].toUpperCase()).join('').slice(0,2),role:role||'Operative',isDirector:false});
  await fbSet('app/team',{members:teamMembers});renderTeam();
}
function startMemberEdit(idx){editingMemberIdx=idx;renderTeam();}
function cancelMemberEdit(){editingMemberIdx=-1;renderTeam();}
async function saveMemberEdit(idx){
  const name=document.getElementById('edit-name-'+idx).value.trim();
  const role=document.getElementById('edit-role-'+idx).value.trim();
  if(!name)return;
  teamMembers[idx]={...teamMembers[idx],name,role:role||'Operative',initials:name.split(' ').map(p=>p[0].toUpperCase()).join('').slice(0,2)};
  editingMemberIdx=-1;await fbSet('app/team',{members:teamMembers});renderTeam();
}
async function removeMember(idx){teamMembers.splice(idx,1);await fbSet('app/team',{members:teamMembers});renderTeam();}

function getPayWeekKey(offset){const d=new Date();d.setDate(d.getDate()+offset*7);const day=d.getDay(),diff=d.getDate()-day+(day===0?-6:1);return new Date(d.setDate(diff)).toISOString().split('T')[0];}
function getPayWeekLabel(offset){const wk=getPayWeekKey(offset);const mon=new Date(wk+'T12:00:00'),fri=new Date(mon);fri.setDate(fri.getDate()+4);const fmt=d=>d.toLocaleDateString('en-GB',{day:'numeric',month:'short'});return offset===0?`This Week (${fmt(mon)} – ${fmt(fri)})`:fmt(mon)+' – '+fmt(fri);}
function getColourPayDays(id){const c=colourLabels.find(c=>c.id===id);if(c&&c.payDays!==undefined)return c.payDays;const d=DEFAULT_COLOURS.find(c=>c.id===id);return d?(d.payDays||0):0;}
function getCalDaysForWeek(name,wk){const mon=new Date(wk+'T12:00:00');let count=0;for(let i=0;i<7;i++){const d=new Date(mon);d.setDate(d.getDate()+i);(calEntries[d.toISOString().split('T')[0]]||[]).forEach(e=>{if(e.person===name)count+=getColourPayDays(e.colourId||0);});}return count;}
function calcEntryAmount(e){let base=0;const days=parseFloat(e.days),rate=parseFloat(e.rate),price=parseFloat(e.priceTotal);if(e.basis==='day-rate'&&!isNaN(days)&&!isNaN(rate))base=days*rate;else if(e.basis==='price-work'&&!isNaN(price))base=price;return base+(parseFloat(e.otHours)||0)*(parseFloat(e.otRate)||0);}

let _pFid=null,_pFval=null;
function renderPayLog(){
  if(document.activeElement&&document.activeElement.dataset&&document.activeElement.dataset.fieldkey){_pFid=document.activeElement.dataset.fieldkey;_pFval=document.activeElement.value;}
  const wk=getPayWeekKey(payLogWeekOffset);
  const entries=payLog[wk]?JSON.parse(JSON.stringify(payLog[wk])):[];
  const eIds=entries.map(e=>e.personId);
  teamMembers.forEach(m=>{if(!eIds.includes(m.id)){const cd=getCalDaysForWeek(m.name,wk);entries.push({personId:m.id,name:m.name,role:m.role,days:cd>0?cd:'',rate:'',basis:'day-rate',priceTotal:'',otHours:'',otRate:'',note:'',amount:0});}});
  entries.forEach(e=>{if(!e.days||e.days===''){const cd=getCalDaysForWeek(e.name,wk);if(cd>0)e.days=cd;}if(!e.basis)e.basis='day-rate';e.amount=calcEntryAmount(e);});
  const total=entries.reduce((s,e)=>s+(parseFloat(e.amount)||0),0);
  const past=Object.keys(payLog).sort().reverse().filter(k=>k!==wk);

  let html=`<div class="view-header"><div class="view-title">Pay Log</div><div class="view-subtitle">Weekly pay — days auto-filled from calendar</div></div><div class="paylog-week-selector"><button class="cal-nav-btn" onclick="changePayWeek(-1)">&#8249;</button><div class="paylog-week-label">${getPayWeekLabel(payLogWeekOffset)}</div><button class="cal-nav-btn" onclick="changePayWeek(1)">&#8250;</button></div>`;

  entries.forEach(e=>{
    const cd=getCalDaysForWeek(e.name,wk),amt=calcEntryAmount(e),otAmt=(parseFloat(e.otHours)||0)*(parseFloat(e.otRate)||0),pid=e.personId;
    html+=`<div style="background:#fff;border:1px solid #d4c4a8;margin-bottom:14px;border-left:4px solid #1a1a1a;"><div style="background:#1a1a1a;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;"><div><span style="font-family:'Playfair Display',serif;font-size:16px;font-weight:700;color:#f5ede3;">${e.name}</span><span style="font-size:11px;color:#888;margin-left:8px;">${e.role||''}</span></div><span style="font-family:'Playfair Display',serif;font-size:18px;font-weight:700;color:#f5ede3;">£${amt.toFixed(2)}</span></div><div style="padding:14px;"><div style="display:flex;gap:8px;margin-bottom:12px;"><button onclick="setPayBasis('${wk}','${pid}','day-rate')" style="flex:1;padding:8px;border:none;cursor:pointer;font-family:'Barlow',sans-serif;font-size:12px;font-weight:600;letter-spacing:1px;text-transform:uppercase;${e.basis==='day-rate'?'background:#1a1a1a;color:#f5ede3;':'background:#f5ede3;color:#888;'}">Day Rate</button><button onclick="setPayBasis('${wk}','${pid}','price-work')" style="flex:1;padding:8px;border:none;cursor:pointer;font-family:'Barlow',sans-serif;font-size:12px;font-weight:600;letter-spacing:1px;text-transform:uppercase;${e.basis==='price-work'?'background:#1a1a1a;color:#f5ede3;':'background:#f5ede3;color:#888;'}">Price Work</button></div>${e.basis==='day-rate'?`<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;"><div><label style="display:block;font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#888;margin-bottom:4px;">Days Worked</label><input class="paylog-input" type="number" min="0" step="0.5" value="${e.days}" placeholder="${cd>0?cd+' in cal':'0'}" data-fieldkey="${pid}-days" oninput="updatePayField('${wk}','${pid}','days',this.value)"/>${cd>0?`<div class="cal-days-info">&#128197; ${cd} days in calendar</div>`:''}</div><div><label style="display:block;font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#888;margin-bottom:4px;">Day Rate £</label><input class="paylog-input" type="number" min="0" step="0.01" value="${e.rate}" placeholder="e.g. 180" data-fieldkey="${pid}-rate" oninput="updatePayField('${wk}','${pid}','rate',this.value)"/></div></div>`:`<div style="margin-bottom:10px;"><label style="display:block;font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#888;margin-bottom:4px;">Price Work Total £</label><input class="paylog-input" type="number" min="0" step="0.01" value="${e.priceTotal||''}" placeholder="e.g. 1200" data-fieldkey="${pid}-priceTotal" oninput="updatePayField('${wk}','${pid}','priceTotal',this.value)"/></div>`}<div style="border-top:1px solid #d4c4a8;padding-top:12px;margin-bottom:10px;"><div class="ot-label">Overtime / Evenings</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;"><div><label style="display:block;font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#888;margin-bottom:4px;">OT Hours</label><input class="paylog-input" type="number" min="0" step="0.5" value="${e.otHours||''}" placeholder="e.g. 3" data-fieldkey="${pid}-otHours" oninput="updatePayField('${wk}','${pid}','otHours',this.value)"/></div><div><label style="display:block;font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#888;margin-bottom:4px;">OT Rate £/hr</label><input class="paylog-input" type="number" min="0" step="0.01" value="${e.otRate||''}" placeholder="e.g. 37.50" data-fieldkey="${pid}-otRate" oninput="updatePayField('${wk}','${pid}','otRate',this.value)"/></div></div>${otAmt>0?`<div style="font-size:12px;color:#2a2a26;margin-top:4px;">OT total: £${otAmt.toFixed(2)}</div>`:''}</div><div><label style="display:block;font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#888;margin-bottom:4px;">Note</label><input class="paylog-input" type="text" value="${e.note||''}" placeholder="Optional note" data-fieldkey="${pid}-note" oninput="updatePayField('${wk}','${pid}','note',this.value)"/></div></div></div>`;
  });

  const bRows=entries.map(e=>{const amt=calcEntryAmount(e),otAmt=(parseFloat(e.otHours)||0)*(parseFloat(e.otRate)||0),base=amt-otAmt;if(amt===0)return `<div style="display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:1px solid #d4c4a8;"><span style="font-weight:600;font-size:13px;">${e.name}</span><span style="font-size:12px;color:#aaa;font-style:italic;">Not entered</span></div>`;let d='';if(e.basis==='day-rate'&&e.days)d+=e.days+' days x £'+e.rate+' = £'+base.toFixed(2);if(e.basis==='price-work'&&e.priceTotal)d+='Price work: £'+parseFloat(e.priceTotal).toFixed(2);if(otAmt>0)d+=' + '+e.otHours+'hr OT x £'+e.otRate+' = £'+otAmt.toFixed(2);return `<div style="padding:10px 16px;border-bottom:1px solid #d4c4a8;"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:3px;"><span style="font-weight:600;font-size:14px;">${e.name}</span><span style="font-family:'Playfair Display',serif;font-size:16px;font-weight:700;color:#1a1a1a;">£${amt.toFixed(2)}</span></div><div style="font-size:12px;color:#888;">${d}</div></div>`;}).join('');

  html+=`<div style="background:#fff;border:1px solid #d4c4a8;margin-bottom:14px;"><div style="background:#1a1a1a;padding:10px 16px;"><div style="font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#f5ede3;">This Week — Breakdown</div></div>${bRows}<div style="display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:#e8ddd4;"><span style="font-family:'Playfair Display',serif;font-size:15px;font-weight:700;color:#1a1a1a;">Total Wages This Week</span><span style="font-family:'Playfair Display',serif;font-size:20px;font-weight:900;color:#1a1a1a;">£${total.toFixed(2)}</span></div></div>`;
  html+=`<div class="paylog-save-row"><button class="notes-save-btn" onclick="savePayLog('${wk}')">Save Pay Log</button><span class="saved-msg" id="pay-saved-msg">Saved &#x2713;</span></div>`;

  if(past.length>0){
    html+='<div class="paylog-history"><div class="paylog-history-header"><div class="paylog-history-title">Previous Weeks</div></div>';
    past.forEach(wkKey=>{
      const wE=payLog[wkKey]||[],wT=wE.reduce((s,e)=>s+(parseFloat(e.amount)||0),0);
      const mon=new Date(wkKey+'T12:00:00'),fri=new Date(mon);fri.setDate(fri.getDate()+4);
      const fmt=d=>d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
      html+=`<div class="paylog-hist-week"><div class="paylog-hist-week-label">w/c ${fmt(mon)} — Total: £${wT.toFixed(2)}</div>${wE.filter(e=>calcEntryAmount(e)>0).map(e=>`<div class="paylog-hist-row"><div class="paylog-hist-name">${e.name}</div><div class="paylog-hist-detail">${e.basis==='day-rate'&&e.days?e.days+' days @ £'+e.rate+'/day':''}${e.basis==='price-work'&&e.priceTotal?'Price work £'+e.priceTotal:''}<span class="basis-badge ${e.basis}" style="margin-left:6px;">${e.basis==='day-rate'?'Day Rate':'Price Work'}</span>${(parseFloat(e.otHours)||0)>0?`<span style="color:#2a2a26;margin-left:8px;">+${e.otHours}hr OT</span>`:''} ${e.note?`<span style="color:#888;margin-left:8px;">${e.note}</span>`:''}</div><div class="paylog-hist-amount">£${calcEntryAmount(e).toFixed(2)}</div></div>`).join('')}</div>`;
    });
    html+='</div>';
  }
  document.getElementById('view-paylog').innerHTML=html;
  if(_pFid){const el=document.querySelector(`[data-fieldkey="${_pFid}"]`);if(el){el.focus();el.value=_pFval||el.value;_pFid=null;}}
}

function changePayWeek(dir){payLogWeekOffset+=dir;renderPayLog();}
function ensurePayEntry(wk,pid){if(!payLog[wk])payLog[wk]=[];let e=payLog[wk].find(e=>e.personId===pid);if(!e){const m=teamMembers.find(m=>m.id===pid)||{};e={personId:pid,name:m.name||'',role:m.role||'',days:'',rate:'',basis:'day-rate',priceTotal:'',otHours:'',otRate:'',note:'',amount:0};payLog[wk].push(e);}if(!e.basis)e.basis='day-rate';return e;}
function setPayBasis(wk,pid,basis){const e=ensurePayEntry(wk,pid);e.basis=basis;e.amount=calcEntryAmount(e);renderPayLog();}
function updatePayField(wk,pid,field,val){const e=ensurePayEntry(wk,pid);e[field]=val;e.amount=calcEntryAmount(e);renderPayLog();}
async function savePayLog(wk){await fbSet('app/paylog',payLog);const msg=document.getElementById('pay-saved-msg');if(msg){msg.style.opacity='1';setTimeout(()=>msg.style.opacity='0',2000);}}

function renderSettings(){
  const merged=DEFAULT_COLOURS.map(dc=>{const l=colourLabels.find(c=>c.id===dc.id);return l?Object.assign({},dc,l):dc;});
  let html='<div class="view-header"><div class="view-title">Settings</div><div class="view-subtitle">Colour labels and preferences</div></div><div class="settings-section"><div class="settings-header"><div class="settings-header-title">Calendar Colour Labels</div></div><div class="settings-body">';
  merged.forEach(c=>{const pd=c.payDays!==undefined?c.payDays:0;html+=`<div class="colour-row"><div class="colour-swatch" style="background:${c.hex}"></div><input class="colour-input" type="text" value="${c.label}" placeholder="Name this colour..." oninput="updateColourLabel(${c.id},this.value)"/><div style="font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:${pd>0?'#2e7d52':'#888'};min-width:60px;text-align:right;">${pd===1?'Full day':pd===0.5?'Half day':'No pay'}</div></div>`;});
  html+='<div style="font-size:12px;color:#555;margin-top:12px;padding:10px;background:#f5ede3;border:1px solid #d4c4a8;">Green = full day pay &nbsp;|&nbsp; Burgundy = 0.5 days pay &nbsp;|&nbsp; All other colours = no pay counted</div><div style="display:flex;gap:10px;align-items:center;margin-top:14px;flex-wrap:wrap;"><button class="notes-save-btn" onclick="saveColourLabels()">Save Labels</button><button onclick="resetColourDefaults()" style="background:none;border:1px solid #c0392b;color:#c0392b;font-family:Barlow,sans-serif;font-size:11px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;padding:8px 18px;cursor:pointer;">Reset to Defaults</button><span class="saved-msg" id="colours-saved-msg">Saved &#x2713;</span></div></div></div>';
  document.getElementById('view-settings').innerHTML=html;
}

function updateColourLabel(id,val){colourLabels=colourLabels.map(c=>c.id===id?Object.assign({},c,{label:val}):c);}
async function resetColourDefaults(){colourLabels=DEFAULT_COLOURS.map(c=>Object.assign({},c));await fbSet('app/colours',{list:colourLabels});renderSettings();renderCalendar();}
async function saveColourLabels(){const ts=colourLabels.map(c=>{const d=DEFAULT_COLOURS.find(d=>d.id===c.id);return Object.assign({},c,{payDays:d?d.payDays:(c.payDays||0)});});colourLabels=ts;await fbSet('app/colours',{list:ts});const msg=document.getElementById('colours-saved-msg');if(msg){msg.style.opacity='1';setTimeout(()=>msg.style.opacity='0',2000);}}

function showNotif(from,msg){document.getElementById('notif-from').textContent=from;document.getElementById('notif-msg').textContent=msg;const el=document.getElementById('notification');el.style.display='block';setTimeout(()=>el.style.display='none',5000);}

const views=['tasks','calendar','paylog','team','settings'];
function showView(view,tab){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  if(tab)tab.classList.add('active');
  views.forEach(v=>document.getElementById('view-'+v).style.display=v===view?'block':'none');
  if(!dataLoaded)return;
  if(view==='tasks')renderTasks();
  if(view==='calendar')renderCalendar();
  if(view==='paylog')renderPayLog();
  if(view==='team')renderTeam();
  if(view==='settings')renderSettings();
}

async function login(user){
  document.getElementById('login-screen').style.display='none';
  document.getElementById('app').style.display='block';
  currentUser=user;
  document.getElementById('header-avatar').textContent=user==='macauly'?'MP':'BP';
  document.getElementById('header-name').textContent=user==='macauly'?'Macauly':'Brad';
  views.forEach(v=>{const el=document.getElementById('view-'+v);if(el)el.style.display='none';});
  document.getElementById('view-tasks').style.display='block';
  document.getElementById('view-tasks').innerHTML='<div class="loading-state">Loading your data</div>';
  await loadAll();
  lastNudgeCount=nudges.filter(n=>n.to===currentUser&&n.date===todayKey()).length;
  await checkAndUpdateStreaks();
  showView('tasks',null);
  document.querySelectorAll('.tab')[0].classList.add('active');
}

function logout(){
  unsubscribers.forEach(u=>u());unsubscribers=[];
  currentUser=null;dataLoaded=false;calYear=undefined;calMonth=undefined;selectedCalDate=null;
  document.getElementById('login-screen').style.display='flex';
  document.getElementById('app').style.display='none';
}

window.login=login;window.logout=logout;window.showView=showView;
window.toggleTask=toggleTask;
window.changeMonth=changeMonth;window.selectCalDay=selectCalDay;
window.addCalEntry=addCalEntry;window.removeCalEntry=removeCalEntry;
window.copyPrevDay=copyPrevDay;window.saveNote=saveNote;window.saveCalOT=saveCalOT;
window.sendNudge=sendNudge;
window.addMember=addMember;window.removeMember=removeMember;
window.startMemberEdit=startMemberEdit;window.cancelMemberEdit=cancelMemberEdit;window.saveMemberEdit=saveMemberEdit;
window.changePayWeek=changePayWeek;window.updatePayField=updatePayField;window.savePayLog=savePayLog;
window.setPayBasis=setPayBasis;window.ensurePayEntry=ensurePayEntry;
window.updateColourLabel=updateColourLabel;window.saveColourLabels=saveColourLabels;
window.resetColourDefaults=resetColourDefaults;

}); // end window.addEventListener('load')
